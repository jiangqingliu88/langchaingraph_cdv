interfaces:
  clock: pclk
  config:
    is_active: UVM_ACTIVE
  name: UART_out
  parameters:
  - name: DATA_WIDTH
    type: int
    value: '32'
  ports:
  - dir: input
    name: pclk
    width: 1
  - dir: input
    name: presetn
    width: 1
  - dir: output
    name: tx
    width: 1
  - dir: input
    name: rx
    width: 1
  reset: presetn
  transaction_constraints:
  - name: valid_c
    value: '{ data inside {[0:255]}; }'
  transaction_vars:
  - iscompare: 'True'
    isrand: 'False'
    name: data
    type: bit [7:0]
  - iscompare: 'True'
    isrand: 'False'
    name: status
    type: bit [3:0]
