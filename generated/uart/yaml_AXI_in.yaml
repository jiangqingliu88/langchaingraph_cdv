interfaces:
  clock: pclk
  config:
    is_active: UVM_ACTIVE
  name: AXI_in
  parameters:
  - name: DATA_WIDTH
    type: int
    value: '32'
  ports:
  - dir: input
    name: pclk
    width: 1
  - dir: input
    name: presetn
    width: 1
  - dir: output
    name: awaddr
    width: 32
  - dir: output
    name: awvalid
    width: 1
  - dir: input
    name: awready
    width: 1
  - dir: output
    name: wdata
    width: 32
  - dir: output
    name: wvalid
    width: 1
  - dir: input
    name: wready
    width: 1
  - dir: output
    name: araddr
    width: 32
  - dir: output
    name: arvalid
    width: 1
  - dir: input
    name: arready
    width: 1
  - dir: input
    name: rdata
    width: 32
  - dir: input
    name: rvalid
    width: 1
  - dir: output
    name: rready
    width: 1
  reset: presetn
  transaction_constraints:
  - name: valid_c
    value: '{ data inside {[0:255]}; }'
  transaction_vars:
  - iscompare: 'True'
    isrand: 'True'
    name: addr
    type: bit [31:0]
  - iscompare: 'True'
    isrand: 'True'
    name: data
    type: bit [31:0]
  - iscompare: 'True'
    isrand: 'True'
    name: is_write
    type: bit
