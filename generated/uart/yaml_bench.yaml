bench:
  agents:
    AXI_in:
      clock: pclk
      interface: axi4_lite_if
      reset: presetn
    UART_in:
      clock: pclk
      interface: uart_if
      reset: presetn
    UART_out:
      clock: pclk
      interface: uart_if
      reset: presetn
  clk_rst_vip:
    enabled: false
  env_name: uart_env
  name: uart_bench
  timeout: 10ms
