interfaces:
  clock: pclk
  config:
    is_active: UVM_ACTIVE
  name: UART_in
  parameters:
  - name: DATA_WIDTH
    type: int
    value: '32'
  ports:
  - dir: input
    name: pclk
    width: 1
  - dir: input
    name: presetn
    width: 1
  - dir: output
    name: tx
    width: 1
  - dir: input
    name: rx
    width: 1
  - dir: output
    name: interrupt
    width: 4
  reset: presetn
  transaction_constraints:
  - name: valid_c
    value: '{ data inside {[0:255]}; }'
  transaction_vars:
  - iscompare: 'True'
    isrand: 'True'
    name: data
    type: bit [7:0]
  - iscompare: 'True'
    isrand: 'True'
    name: parity
    type: bit [1:0]
  - iscompare: 'True'
    isrand: 'True'
    name: stop_bits
    type: bit [1:0]
  - iscompare: 'True'
    isrand: 'True'
    name: baud_rate
    type: int
