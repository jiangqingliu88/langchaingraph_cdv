environment:
  agents:
    AXI_in:
      clock: pclk
      interface: axi4_lite_if
      reset: presetn
    UART_in:
      clock: pclk
      interface: uart_if
      reset: presetn
    UART_out:
      clock: pclk
      interface: uart_if
      reset: presetn
  clk_rst_vip:
    enabled: false
  config_vars:
  - name: has_scoreboard
    type: bit
    value: 1
  - name: has_functional_coverage
    type: bit
    value: 1
  - name: has_virtual_sequencer
    type: bit
    value: 1
  - name: num_transactions
    type: int
    value: 100
  env_name: uart_env
  name: uart_env
  scoreboards:
  - enabled: true
    name: uart_scoreboard
    transaction_type: UART_out_transaction
    type: uvm_in_order_class_comparator
  - enabled: true
    name: uart_coverage_collector
    transaction_type: UART_in_transaction
    type: uart_coverage
  tlm_connections:
  - from: UART_in_agent_h.mon.item_collected_port
    to: uart_scoreboard_h.analysis_export
  - from: UART_out_agent_h.mon.item_collected_port
    to: uart_scoreboard_h.expected_export
  - from: UART_in_agent_h.mon.item_collected_port
    to: uart_coverage_collector_h.analysis_export
  - from: AXI_in_agent_h.mon.item_collected_port
    to: uart_scoreboard_h.analysis_export
  virtual_sequencer:
    enabled: true
    name: uart_env_virtual_sequencer
