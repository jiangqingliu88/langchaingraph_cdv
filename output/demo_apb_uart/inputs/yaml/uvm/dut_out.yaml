interfaces:
  name: dut_out
  clock: clk
  reset: rst
  parameters:
    - { name: DATA_WIDTH, type: int, value: '32' }
  ports:
    - { name: clk, dir: input, width: 1 }
    - { name: rst, dir: input, width: 1 }
    - { name: data, dir: input, width: DATA_WIDTH }
    - { name: valid, dir: input, width: 1 }
    - { name: ready, dir: output, width: 1 }
  transaction_vars:
    - { name: data, type: "bit [DATA_WIDTH-1:0]", iscompare: 'True', isrand: 'True' }
  transaction_constraints:
    - name: valid_c
      value: '{{ data inside {{[0:255]}}; }}'
  config:
    is_active: UVM_ACTIVE
