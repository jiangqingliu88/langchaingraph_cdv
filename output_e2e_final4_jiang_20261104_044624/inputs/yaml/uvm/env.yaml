environment:
  name: npu_sched_env
  agents:
    - name: npu_sched_in
      is_active: true
      is_master: True
      interface: npu_sched_in
      type: npu_sched_in_master_agent
      clock: clk
      reset: rst_n
    - name: npu_sched_out
      is_active: false
      is_master: True
      interface: npu_sched_out
      type: npu_sched_out_master_agent
      clock: clk
      reset: rst_n
  tests:
    - { dimension: D_queue, value: '0', key: d_queue, int_value: 0, tp_id: TP-NPUSCH-D_QUEUE-0, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '1', key: d_queue, int_value: 1, tp_id: TP-NPUSCH-D_QUEUE-1, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '7', key: d_queue, int_value: 7, tp_id: TP-NPUSCH-D_QUEUE-7, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '8', key: d_queue, int_value: 8, tp_id: TP-NPUSCH-D_QUEUE-8, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '15', key: d_queue, int_value: 15, tp_id: TP-NPUSCH-D_QUEUE-15, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '16', key: d_queue, int_value: 16, tp_id: TP-NPUSCH-D_QUEUE-16, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '24', key: d_queue, int_value: 24, tp_id: TP-NPUSCH-D_QUEUE-24, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '25', key: d_queue, int_value: 25, tp_id: TP-NPUSCH-D_QUEUE-25, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '31', key: d_queue, int_value: 31, tp_id: TP-NPUSCH-D_QUEUE-31, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_queue, value: '32', key: d_queue, int_value: 32, tp_id: TP-NPUSCH-D_QUEUE-32, backdoor_path: npu_sched_bench_tb_top.u_npu_sched.queue_level }
    - { dimension: D_type, value: 'MAC', key: d_type, int_value: 0, field: instr_type, tp_id: TP-NPUSCH-D_TYPE-MAC }
    - { dimension: D_type, value: 'VECTOR', key: d_type, int_value: 1, field: instr_type, tp_id: TP-NPUSCH-D_TYPE-VECTOR }
    - { dimension: D_type, value: 'SCALAR', key: d_type, int_value: 2, field: instr_type, tp_id: TP-NPUSCH-D_TYPE-SCALAR }
    - { dimension: D_type, value: 'DMA', key: d_type, int_value: 3, field: instr_type, tp_id: TP-NPUSCH-D_TYPE-DMA }
    - { dimension: D_dtype, value: 'INT8', key: d_dtype, int_value: 0, field: instr_dtype, tp_id: TP-NPUSCH-D_DTYPE-INT8 }
    - { dimension: D_dtype, value: 'FP16', key: d_dtype, int_value: 1, field: instr_dtype, tp_id: TP-NPUSCH-D_DTYPE-FP16 }
    - { dimension: D_dtype, value: 'BF16', key: d_dtype, int_value: 2, field: instr_dtype, tp_id: TP-NPUSCH-D_DTYPE-BF16 }
    - { dimension: D_dtype, value: 'FP32', key: d_dtype, int_value: 3, field: instr_dtype, tp_id: TP-NPUSCH-D_DTYPE-FP32 }
    - { dimension: D_dep, value: 'NONE', key: d_dep, int_value: 0, tp_id: TP-NPUSCH-D_DEP-NONE }
    - { dimension: D_dep, value: 'RAW', key: d_dep, int_value: 1, tp_id: TP-NPUSCH-D_DEP-RAW }
    - { dimension: D_dep, value: 'WAW', key: d_dep, int_value: 2, tp_id: TP-NPUSCH-D_DEP-WAW }
    - { dimension: D_dep, value: 'WAR', key: d_dep, int_value: 3, tp_id: TP-NPUSCH-D_DEP-WAR }
    - { dimension: D_unit, value: 'MAC', key: d_unit, int_value: 0, tp_id: TP-NPUSCH-D_UNIT-MAC }
    - { dimension: D_unit, value: 'VECTOR', key: d_unit, int_value: 1, tp_id: TP-NPUSCH-D_UNIT-VECTOR }
    - { dimension: D_unit, value: 'SCALAR', key: d_unit, int_value: 2, tp_id: TP-NPUSCH-D_UNIT-SCALAR }
    - { dimension: D_unit, value: 'DMA', key: d_unit, int_value: 3, tp_id: TP-NPUSCH-D_UNIT-DMA }
    - { dimension: D_decision, value: 'ISSUED', key: d_decision, int_value: 0, tp_id: TP-NPUSCH-D_DECISION-ISSUED }
    - { dimension: D_decision, value: 'STALLED', key: d_decision, int_value: 1, tp_id: TP-NPUSCH-D_DECISION-STALLED }
    - { dimension: D_decision, value: 'BLOCKED', key: d_decision, int_value: 2, tp_id: TP-NPUSCH-D_DECISION-BLOCKED }
    - { dimension: D_decision, value: 'FLUSHED', key: d_decision, int_value: 3, tp_id: TP-NPUSCH-D_DECISION-FLUSHED }
    - { dimension: D_cluster, value: '0', key: d_cluster, int_value: 0, tp_id: TP-NPUSCH-D_CLUSTER-0 }
    - { dimension: D_cluster, value: '1', key: d_cluster, int_value: 1, tp_id: TP-NPUSCH-D_CLUSTER-1 }
    - { dimension: D_cluster, value: '2', key: d_cluster, int_value: 2, tp_id: TP-NPUSCH-D_CLUSTER-2 }
    - { dimension: D_cluster, value: '3', key: d_cluster, int_value: 3, tp_id: TP-NPUSCH-D_CLUSTER-3 }
    - { dimension: D_opcode, value: 'MAC_INT8', key: d_opcode, int_value: 0, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-MAC_INT8 }
    - { dimension: D_opcode, value: 'MAC_FP16', key: d_opcode, int_value: 1, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-MAC_FP16 }
    - { dimension: D_opcode, value: 'MAC_BF16', key: d_opcode, int_value: 2, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-MAC_BF16 }
    - { dimension: D_opcode, value: 'VEC_ADD', key: d_opcode, int_value: 3, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-VEC_ADD }
    - { dimension: D_opcode, value: 'VEC_MUL', key: d_opcode, int_value: 4, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-VEC_MUL }
    - { dimension: D_opcode, value: 'VEC_RELU', key: d_opcode, int_value: 5, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-VEC_RELU }
    - { dimension: D_opcode, value: 'LOAD', key: d_opcode, int_value: 6, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-LOAD }
    - { dimension: D_opcode, value: 'STORE', key: d_opcode, int_value: 7, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-STORE }
    - { dimension: D_opcode, value: 'DMA_READ', key: d_opcode, int_value: 8, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-DMA_READ }
    - { dimension: D_opcode, value: 'DMA_WRITE', key: d_opcode, int_value: 9, field: instr_opcode, tp_id: TP-NPUSCH-D_OPCODE-DMA_WRITE }
    - { dimension: D_seq, value: 'MAC_MAC', key: d_seq, int_value: 0, field: instr_opcode, tp_id: TP-NPUSCH-D_SEQ-MAC_MAC, sequence: adjacent_opcode_pair, sequence_values: [0, 0] }
    - { dimension: D_seq, value: 'LOAD_MAC', key: d_seq, int_value: 1, field: instr_opcode, tp_id: TP-NPUSCH-D_SEQ-LOAD_MAC, sequence: adjacent_opcode_pair, sequence_values: [6, 0] }
    - { dimension: D_seq, value: 'MAC_STORE', key: d_seq, int_value: 2, field: instr_opcode, tp_id: TP-NPUSCH-D_SEQ-MAC_STORE, sequence: adjacent_opcode_pair, sequence_values: [0, 7] }
    - { dimension: D_seq, value: 'DMA_MAC', key: d_seq, int_value: 3, field: instr_opcode, tp_id: TP-NPUSCH-D_SEQ-DMA_MAC, sequence: adjacent_opcode_pair, sequence_values: [8, 0] }
    - { dimension: D_seq, value: 'VEC_MAC', key: d_seq, int_value: 4, field: instr_opcode, tp_id: TP-NPUSCH-D_SEQ-VEC_MAC, sequence: adjacent_opcode_pair, sequence_values: [3, 0] }
    - { dimension: D_seq, value: 'SCALAR_MAC', key: d_seq, int_value: 5, field: instr_opcode, tp_id: TP-NPUSCH-D_SEQ-SCALAR_MAC, sequence: adjacent_opcode_pair, sequence_values: [0, 0] }
    - { dimension: D_pipeline, value: 'NONE', key: d_pipeline, int_value: 0, field: instr_opcode, tp_id: TP-NPUSCH-D_PIPELINE-NONE, sequence: pipeline_overlap, sequence_values: [0] }
    - { dimension: D_pipeline, value: 'MAC_MAC', key: d_pipeline, int_value: 1, field: instr_opcode, tp_id: TP-NPUSCH-D_PIPELINE-MAC_MAC, sequence: pipeline_overlap, sequence_values: [0, 0] }
    - { dimension: D_pipeline, value: 'MAC_DMA', key: d_pipeline, int_value: 2, field: instr_opcode, tp_id: TP-NPUSCH-D_PIPELINE-MAC_DMA, sequence: pipeline_overlap, sequence_values: [0, 8] }
    - { dimension: D_pipeline, value: 'VEC_MAC', key: d_pipeline, int_value: 3, field: instr_opcode, tp_id: TP-NPUSCH-D_PIPELINE-VEC_MAC, sequence: pipeline_overlap, sequence_values: [3, 0] }
    - { dimension: D_pipeline, value: 'MULTI_OP', key: d_pipeline, int_value: 4, field: instr_opcode, tp_id: TP-NPUSCH-D_PIPELINE-MULTI_OP, sequence: pipeline_overlap, sequence_values: [0, 3, 8] }
    - { dimension: D_priority, value: 'HIGH_FIRST', key: d_priority, int_value: 0, field: op_priority, tp_id: TP-NPUSCH-D_PRIORITY-HIGH_FIRST }
    - { dimension: D_priority, value: 'LOW_FIRST', key: d_priority, int_value: 1, field: op_priority, tp_id: TP-NPUSCH-D_PRIORITY-LOW_FIRST }
    - { dimension: D_priority, value: 'SAME_PRIO', key: d_priority, int_value: 2, field: op_priority, tp_id: TP-NPUSCH-D_PRIORITY-SAME_PRIO }
    - { dimension: D_priority, value: 'ROUND_ROBIN', key: d_priority, int_value: 3, field: op_priority, tp_id: TP-NPUSCH-D_PRIORITY-ROUND_ROBIN }
    - { dimension: D_barrier, value: 'NONE', key: d_barrier, int_value: 0, field: barrier_type, tp_id: TP-NPUSCH-D_BARRIER-NONE }
    - { dimension: D_barrier, value: 'TILE_BARRIER', key: d_barrier, int_value: 1, field: barrier_type, tp_id: TP-NPUSCH-D_BARRIER-TILE_BARRIER }
    - { dimension: D_barrier, value: 'OP_BARRIER', key: d_barrier, int_value: 2, field: barrier_type, tp_id: TP-NPUSCH-D_BARRIER-OP_BARRIER }
    - { dimension: D_barrier, value: 'CLUSTER_BARRIER', key: d_barrier, int_value: 3, field: barrier_type, tp_id: TP-NPUSCH-D_BARRIER-CLUSTER_BARRIER }
  batches:
    - { name: npu_basic_test, theme: TH-B01, dimensions: 'D_decision', method: D, policy: p_th_b01_directed, priority: P0, checks: 'CHECK-FUNC' }
    - { name: npu_type_test, theme: TH-B02, dimensions: 'D_type', method: RND, policy: p_th_b02_random, priority: P0, checks: 'CHECK-FUNC' }
    - { name: npu_dtype_test, theme: TH-B03, dimensions: 'D_dtype', method: RND, policy: p_th_b03_random, priority: P0, checks: 'CHECK-FUNC' }
    - { name: npu_dep_test, theme: TH-B04, dimensions: 'D_dep,D_decision', method: G, policy: p_th_b04_combo, priority: P1, checks: 'CHECK-FUNC' }
    - { name: npu_raw_stall_test, theme: TH-B05, dimensions: 'D_dep', method: SPCL, policy: p_th_b05_special, priority: P1, checks: 'CHECK-FUNC' }
    - { name: npu_full_queue_test, theme: TH-B06, dimensions: 'D_queue,D_decision', method: SPCL, policy: p_th_b06_special, priority: P1, checks: 'CHECK-FUNC,CHECK-WBOX' }
    - { name: npu_cluster_test, theme: TH-B07, dimensions: 'D_cluster,D_unit', method: G, policy: p_th_b07_combo, priority: P2, checks: 'CHECK-FUNC' }
    - { name: npu_opcode_test, theme: TH-B08, dimensions: 'D_opcode,D_unit', method: D, policy: p_th_b08_directed, priority: P2, checks: 'CHECK-FUNC' }
    - { name: npu_dma_compute_test, theme: TH-B09, dimensions: 'D_type,D_unit', method: RND, policy: p_th_b09_random, priority: P3, checks: 'CHECK-FUNC' }
    - { name: npu_pipeline_test, theme: TH-B10, dimensions: 'D_pipeline', method: RND, policy: p_th_b10_random, priority: P3, checks: 'CHECK-FUNC' }
    - { name: npu_random_mix_test, theme: TH-B11, dimensions: 'D_queue,D_type,D_dtype,D_dep,D_unit,D_decision,D_cluster,D_opcode,D_seq,D_pipeline,D_priority,D_barrier', method: RND, policy: p_th_b11_random, priority: P3, checks: 'CHECK-FUNC' }
  clk_rst_vip:
    enabled: true
    clocks:
      - { name: clk, period_ps: 10000, duty_cycle: 50, initial_value: 0, jitter_ps: 0 }
    resets:
      - { name: rst_n, active_low: True, assert_cycles: 10, recover_cycles: 5 }
