bench:
  name: npu_sched_bench
  include_assertions: false
  clk_rst_if:
    clocks:
      - { name: clk, period: 10ns, init: 0 }
    resets:
      - { name: rst_n, init: 0, release_delay: 10 }
  dut_module: npu_sched
  dut_instance: u_npu_sched
  interfaces:
    - name: npu_sched_in_if
      type_name: npu_sched_in_if
      clock: clk
      reset: rst_n
      agent_path: [npu_sched_in_agent_h]
      ports: [instr_valid, instr_opcode, instr_type, instr_dtype, instr_tile_id, instr_src_addr, instr_dst_addr, barrier_type, op_priority]
    - name: npu_sched_out_if
      type_name: npu_sched_out_if
      clock: clk
      reset: rst_n
      agent_path: [npu_sched_out_agent_h]
      ports: [issue_valid, issue_unit, issue_decision]
