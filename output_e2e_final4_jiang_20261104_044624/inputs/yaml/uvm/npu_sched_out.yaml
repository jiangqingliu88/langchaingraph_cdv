interfaces:
  name: npu_sched_out
  clock: clk
  reset: rst_n
  parameters:
    - { name: ISSUE_UNIT_WIDTH, type: int, value: '3' }
    - { name: ISSUE_DECISION_WIDTH, type: int, value: '2' }
  ports:
    - { name: clk, dir: input, width: 1 }
    - { name: rst_n, dir: input, width: 1 }
    - { name: issue_valid, dir: input, width: 1 }
    - { name: issue_unit, dir: input, width: 3 }
    - { name: issue_decision, dir: input, width: 2 }
  transaction_vars:
    - { name: issue_valid, type: "bit", iscompare: 'True', isrand: 'True' }
    - { name: issue_unit, type: "bit [2:0]", iscompare: 'True', isrand: 'True' }
    - { name: issue_decision, type: "bit [1:0]", iscompare: 'True', isrand: 'True' }
  transaction_constraints:
    - name: data_c
      value: '{issue_valid inside {[0:1]}; }'
