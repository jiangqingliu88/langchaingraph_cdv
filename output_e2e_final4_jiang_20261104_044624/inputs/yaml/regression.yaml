# 回归测试配置 — 由 find_spec_yaml 自动生成
# 用法: python regression.py --config output_e2e_final4_jiang_20261104_044624/inputs/yaml/regression.yaml --action all --mode local
#
# ── 用的是 demo.yaml 那套契约（variables + 每 build/test 自带 run_cmd）──
# 旧写法（`global_vars` + `settings.simulators.<sim>.compile/run` 模板）留给
# 回归框架的模板只有 `{files}` / `{run_opts}` 两个占位符，想表达"顶层模块名"
# "日志路径""跑完怎么判成败"都只能往 run_opts 里硬塞，还得记住框架会在命令尾巴上
# 追加 `> sim.log 2>&1`。写成完整 `run_cmd` 就都不用绕了。
#
# ── 仿真业务模式（波形 / 覆盖率 / 调试…）──
# `modes:` 表与聚合变量机制来自 include 的 common_base.yaml；下面同名变量按本后端
# （Questa）**覆盖**了它的 VCS 取值。启用哪几门业务由上层给（CLI `--enable` /
# 工作台工具栏下拉，默认 cov+wave），框架的 apply_modes() 把它们拼进 MODE_OPTS，
# 仿真命令里写 `{{ MODE_OPTS | default("") }}` 取用。
# 值给空串的那些（xprop/tprop/upf）是本后端**没有对应开关**的：选中会被告警忽略，
# 不会把一个不存在的参数塞进命令行。

# 本文件是**后端特定**的生成物（当前 Questa）。保留键校验按这个字段选表；
# 换后端 = 换一份 YAML 模板 + 这里换名字，不改框架代码。
simulator: questa

include:
  - D:/SignOffAI/src/tools/execution/regression_tools/common_base.yaml

variables:
  # 闭环"扩种"动作的偏移加在基准上（见 `_seed_offset`）—— 加到**每一条**上，
  # 否则没有批次计划的那些 test（loopback / 手写用例）永远跑同一批随机流。
  SEED: 12345
  QUESTA: f:/questasim64_2024.1
  UVM_SRC: f:/questasim64_2024.1/verilog_src/uvm-1.2/src
  UVM_DPI: f:/questasim64_2024.1/uvm-1.2/win64/uvm_dpi
  WORK: D:/SignOffAI/output_e2e_final4_jiang_20261104_044624/build/work
  BENCH_TOP: npu_sched_bench_tb_top
  cov_opt: '-coverage -coverstore ${EMAN_CM_DIR}/${EMAN_TEST_NAME} -testname ${EMAN_TEST_NAME}'
  wave_opt: '-voptargs=+acc -qwavedb=+signal+class+wavefile=${EMAN_RUN_DIR}/waves/${EMAN_TEST_NAME}.db +SCB_OFF'
  cov_wave_opt: '-coverage -coverstore ${EMAN_CM_DIR}/${EMAN_TEST_NAME} -testname ${EMAN_TEST_NAME} -voptargs=+acc -qwavedb=+signal+class+wavefile=${EMAN_RUN_DIR}/waves/${EMAN_TEST_NAME}.db'
  debug_all: '-debugdb'
  glitch_opt: '+glitch'
  delta_opt: '+delta'
  xprop: ''
  tprop: ''
  upf_opt: ''

builds:
  - name: build_npu_sched_dut
    top: npu_sched_bench_tb_top
    run_cmd: 'vlog -work {{ WORK }} -sv -mfcu +incdir+{{ UVM_SRC }} {{ UVM_SRC }}/uvm_pkg.sv -f D:/SignOffAI/output_e2e_final4_jiang_20261104_044624/inputs/filelists/filelist.f {% if cov_enabled | default(false) %}+cover{% endif %}'
  - name: build_npu_sched_npu_sched_in_loopback
    top: npu_sched_in_loopback_tb
    run_cmd: 'vlog -work {{ WORK }} -sv -mfcu +incdir+{{ UVM_SRC }} {{ UVM_SRC }}/uvm_pkg.sv -f D:/SignOffAI/output_e2e_final4_jiang_20261104_044624/inputs/filelists/filelist_npu_sched_in_agent_lb.f {% if cov_enabled | default(false) %}+cover{% endif %}'
  - name: build_npu_sched_npu_sched_out_loopback
    top: npu_sched_out_loopback_tb
    run_cmd: 'vlog -work {{ WORK }} -sv -mfcu +incdir+{{ UVM_SRC }} {{ UVM_SRC }}/uvm_pkg.sv -f D:/SignOffAI/output_e2e_final4_jiang_20261104_044624/inputs/filelists/filelist_npu_sched_out_agent_lb.f {% if cov_enabled | default(false) %}+cover{% endif %}'

tests:
  - name: npu_sched_D_ADDR_0
    build: build_npu_sched_dut
    count: 1
    run_cmd: 'vsim -c -sv_lib {{ UVM_DPI }} -onfinish stop -work {{ WORK }} npu_sched_bench_tb_top +UVM_TESTNAME=npu_sched_env_directed_test +ntb_random_seed={{ SEED }} -l sim_vsim.log  -do "log -r /*; run -all; quit -f" {{ MODE_OPTS | default("") }} {{ PLUSARGS }} ; [ -s sim_vsim.log ] && ! grep -qE "UVM_ERROR : *[1-9]|UVM_FATAL : *[1-9]|FATAL ERROR|Errors: *[1-9]" sim_vsim.log && { grep -qE "(\[SCB_DUT\]|Scoreboard:).*mismatched=0" sim_vsim.log || { echo "NO_CHECKER_EVIDENCE: 没有比对结论（真 pass 要求 SCB 报 mismatched=0）"; exit 1; }; }'
    tags: ["p0", "TH-P0"]

