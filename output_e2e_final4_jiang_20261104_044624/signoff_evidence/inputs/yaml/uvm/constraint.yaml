# ============================================================
# 约束模型 —— **由 case 模型生成**（`vagent case-model constraints`）
# ============================================================
# 来源：case 模型 npu_sched
#
# 这是**结构骨架**，不是最终约束。case 模型知道的是建模语义（专题 / 维度 /
# 生成方法 / 优先级），不知道协议参数（地址对齐 / 容量 / 握手时序）—— 那些只能
# 由人补。所以每个策略都是**自定义名**（`gen_uvm` 对自定义名生成空 `apply`
# 骨架，语义校验层会提示"待填"），`params` 为空。
#
# 专题 → 策略：TH-B01→p_th_b01_directed(APPLY_FIRST_MATCH)、TH-B02→p_th_b02_random(APPLY_WEIGHTED)、TH-B03→p_th_b03_random(APPLY_WEIGHTED)、TH-B04→p_th_b04_combo(APPLY_ALL)、TH-B05→p_th_b05_special(APPLY_SEQUENTIAL)、TH-B06→p_th_b06_special(APPLY_SEQUENTIAL)、TH-B07→p_th_b07_combo(APPLY_ALL)、TH-B08→p_th_b08_directed(APPLY_FIRST_MATCH)、TH-B09→p_th_b09_random(APPLY_WEIGHTED)、TH-B10→p_th_b10_random(APPLY_WEIGHTED)、TH-B11→p_th_b11_random(APPLY_WEIGHTED)
#
# **改了 case 模型就重跑本命令**，产物会整体覆盖本文件 —— 所以别在这里手改。
# 协议逻辑写在策略体里（`env/cons/` 下那几个 sv），不在本文件，覆盖是安全的。
#
# 文件放哪：被 `gen_uvm` 扫描的输入路径下都行，**文件名不参与识别** ——
# 认的是顶层有个 `constraint:` 键（`parse_documents`）。
# ============================================================
