# 架构复杂度预算 —— 给“成功带来的复杂度增长”装上刹车。
#
# 规则（由 config/architecture_guard.py 执行）：
#   1. 单文件 > 2000 行 → 失败；> 1500 行 → 必须登记在 watched 里。
#   2. 登记的文件**只能变小不能变大**（actual 必须 <= registered）。
#   3. 单函数圈复杂度 > 20 → 必须登记在 complexity_baseline.json；
#      已登记的函数复杂度**不得再增长**。
#
# 拆文件 / 降复杂度后请同步下调 registered / baseline，别让预算变成永久豁免。

line_budget:
  warn: 1500
  error: 2000

# 每个条目都必须写 reason 和 plan —— “为什么大、准备怎么拆”是给人看的，
# 也是下次有人想再塞东西进来时先看到的成本。
watched:
  # 当前没有登记项：原来超线的几个文件都拆到 1500 行以下了
  # （gen_uvm / flow_tools.api / casemodel.coverage / commands.py；
  #  _tools_old、pipeline_docs 确认无调用方后已删除）。

  src/tools/common/lib/collect_real_coverage.py:
    registered: 1643
    reason: "覆盖率解析 / 回归合并 / 种子多样性 / TP 矩阵的唯一实现；逐用例签核在本轮加了一层委托与矩阵拆分。"
    plan: "下一次动这个文件时把 merge_regression_coverage 与 analyze_seed_diversity 拆到 tools/checking/coverage_tools/，目标 < 1200 行。"

