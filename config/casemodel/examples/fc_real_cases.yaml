# ════════════════════════════════════════════════════════════
# 外部真实 case 列表示例 —— 用于「模型 vs 实现」反向核对
#
# 内容是 config/casemodel/examples/fc_flowcontrol.yaml 生成结果的前 38 条，另外人为注入了
# 7 类真实工程里常见的缺陷，好让 cross_check 的每一条规则都有东西可抓：
#
#   重复 case        复制首条、只改 id 与方法（对象+子对象+字段取值相同）
#   未声明字段       用了模型里没有的 '带宽'
#   未声明取值       用了模型里没有的 '反压模式=脉冲'
#   命名不合规       tc_fc_recv_max_len_tail_01（不符合文档十五节）
#   缺环境指纹       失败后无法复现
#   缺检查项         跑过也不知道验证了什么
#   子对象不存在     FC-99
#
# 用法:
#   python -m src.tools.casemodel_tools.cli analyze config/casemodel/examples/fc_flowcontrol.yaml #       --cases config/casemodel/examples/fc_real_cases.yaml
# ════════════════════════════════════════════════════════════

cases:
- case_id: TC-FC-RECV-G-01
  object: FlowControl
  sub_object: 接收侧流控
  sub_object_id: FC-01
  dimensions: &id001
  - 指令长度
  - 反压模式
  - 反压持续时间
  fields: &id002
    指令长度: '1'
    反压模式: 无
    反压持续时间: 1拍
  method: G
  cross_group: XG-01
  checks: &id003
  - CHECK-FUNC
  - CHECK-WBOX
  cover_bins: &id004
  - cp_len_1
  - cp_bp_none
  environment: &id005
    tool_version: VCS_2024.03-SP2
    rtl_version: dut_v1.2.0
    constraint_version: fc_v1.0
    interface_version: ifc_v2.1
    config_profile: default
    seed: 12345
    compile_options: -ntb_opts uvm-1.2 +define+FC_DEBUG
  expected_result: 不死锁、不丢数、可恢复
  seed: 42
