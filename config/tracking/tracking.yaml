# ════════════════════════════════════════════════════════════════
# 测试点 / 验证资产 跟踪表
#
# 这份文件是「哪些测试点要验、各自用什么验证资产」的**唯一真相**。
# 界面（验证管理系统 → 测试点 / 资产）只读它，不改它 —— 要增删改，
# 直接编辑本文件然后点界面上的「刷新」。
#
# 读取入口：src/tools/tracking_tools/api.py::run_tracking
# 界面模块：src/workbench/modules/vms/tracking/module.py
#
# ── 字段约定 ──
# testpoints[].id          编号，唯一（建议 <module>_TP_<nnn>）
# testpoints[].feature     功能点（对齐 spec 的 features）
# testpoints[].description 这个测试点要验什么
# testpoints[].priority    P0 / P1 / P2
# testpoints[].method      激励方法（D 定向 / RND 随机 / RPLY 回放 / SPCL 特殊）
# testpoints[].status      planned / running / done / failed / waived
# testpoints[].assets      引用的验证资产 id 列表（对不上会在界面上标出来）
#
# assets[].id              资产编号，testpoints[].assets 引用它
# assets[].type            rtl / uvm_env / test / reference_model / waveform / report
# assets[].path            产物路径（相对仓库根）
# assets[].hash            SHA256 或短哈希（可空）
# assets[].status          ok / stale / missing
# assets[].note            备注
# ════════════════════════════════════════════════════════════════

project: apb_uart

testpoints:

  - id: apb_uart_TP_001
    feature: APB 寄存器读写
    description: 通过 APB 读写波特率 / 控制字 / 状态字寄存器，回读一致
    priority: P0
    method: D
    status: done
    assets: [apb_uart_rtl, apb_uart_uvm_env, apb_uart_reg_test]

  - id: apb_uart_TP_002
    feature: UART 发送
    description: FIFO 数据串行发出，9600–115200 各波特率下位误差 ≤ 2%
    priority: P0
    method: RND
    status: running
    assets: [apb_uart_rtl, apb_uart_uvm_env, apb_uart_uart_test]

  - id: apb_uart_TP_003
    feature: UART 接收
    description: 串行输入采样恢复字节，各标准波特率 10000 次传输无误
    priority: P0
    method: RND
    status: planned
    assets: [apb_uart_rtl, apb_uart_uvm_env]

  - id: apb_uart_TP_004
    feature: FIFO 管理
    description: 16 字节收发 FIFO 的满 / 空 / 溢出标志位正确，满时无丢数
    priority: P1
    method: D
    status: done
    assets: [apb_uart_rtl, apb_uart_fifo_test]

  - id: apb_uart_TP_005
    feature: 中断输出
    description: 收完 / 发完 / 溢出的中断在 ≤ 2 个时钟内拉高
    priority: P1
    method: SPCL
    status: planned
    assets: [apb_uart_rtl, apb_uart_uvm_env]

  - id: apb_uart_TP_006
    feature: 寄存器复位值
    description: preset_n 拉低后所有配置寄存器回到规格复位值
    priority: P1
    method: D
    status: planned
    assets: [apb_uart_rtl, apb_uart_reg_test]

  - id: apb_uart_TP_007
    feature: 背压
    description: 发送侧握手反压时数据不丢、不重复
    priority: P2
    method: RND
    status: waived
    assets: [apb_uart_uvm_env]


