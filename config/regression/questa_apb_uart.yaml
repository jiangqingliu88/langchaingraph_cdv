# =============================================================================
# QuestaSim 回归测试 - APB + UART 子系统全量回归
# =============================================================================
# 覆盖 UART Agent 的全部 UVM 测试（direct/random/error），
# 以及 APB Agent 的 loopback 测试。
#
# 使用方式:
#   # 全量回归
#   python regression.py --config config/regression/questa_apb_uart.yaml --mode local
#
#   # 只跑 direct 测试
#   python regression.py --config config/regression/questa_apb_uart.yaml --mode local --tags direct
#
#   # 排除慢速测试
#   python regression.py --config config/regression/questa_apb_uart.yaml --mode local --exclude-tags slow
#
#   # 增量回归 (仅运行受 Git 变更影响的测试)
#   python regression.py --config config/regression/questa_apb_uart.yaml --mode local --incremental
# =============================================================================

extends: "questa_base.yaml"

global_vars:
  SEED: 54321
  WAVES: 0
  COV: 0
  UVM_VERBOSITY: "UVM_MEDIUM"
  UVM_TIMEOUT: "100000000000"

settings:
  default_count: 1
  default_simulator: "questasim_uvm"

tests:

  # =========================================================================
  # 1. UART 基础测试 (direct test)
  # =========================================================================
  - name: "uart_direct_smoke"
    build: "build_uart"
    count: 1
    local_vars:
      UVM_TEST: "uart_env_direct_test"
      WAVES: 1
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
      warnings: 0
    tags: ["smoke", "uart", "direct", "fast"]
    file_pattern:
      - "generated/verify_architect_test/agents/UART_agent/**"
      - "generated/verify_architect_test/env/**"

  # =========================================================================
  # 2. UART 随机测试 - 多 seed 回归
  # =========================================================================
  - name: "uart_random"
    build: "build_uart"
    count: 10
    local_vars:
      UVM_TEST: "uart_env_random_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "uart", "random"]
    file_pattern:
      - "generated/verify_architect_test/agents/UART_agent/**"
      - "generated/verify_architect_test/env/**"

  # =========================================================================
  # 3. UART 波特率矩阵测试
  # =========================================================================
  - name: "uart_baud"
    build: "build_uart"
    count: 2
    matrix:
      - { BAUDRATE: [9600, 19200, 38400, 57600, 115200] }
      - { DATA_BITS: [7, 8] }
      - { PARITY: ["NONE", "EVEN", "ODD"] }
    name_format: "uart_{BAUDRATE}_{DATA_BITS}b_{PARITY}"
    local_vars:
      UVM_TEST: "uart_env_random_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=200000000000"
      - "+BAUDRATE=${BAUDRATE}"
      - "+DATA_BITS=${DATA_BITS}"
      - "+PARITY=${PARITY}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "uart", "baud", "matrix"]
    file_pattern:
      - "generated/verify_architect_test/agents/UART_agent/**"

  # =========================================================================
  # 4. UART 错误注入测试
  # =========================================================================
  - name: "uart_error"
    build: "build_uart"
    count: 1
    matrix:
      - { ERR: ["parity_error", "framing_error", "overrun_error", "break_error"] }
    name_format: "uart_err_{ERR}"
    local_vars:
      UVM_TEST: "uart_env_random_test"
      WAVES: 1
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+INJECT_ERROR=1"
      - "+ERR_TYPE=${ERR}"
      - "+seed=${SEED}"
    expect:
      errors: "any"
    tags: ["error_inject", "uart", "debug"]
    file_pattern:
      - "generated/verify_architect_test/agents/UART_agent/**"

  # =========================================================================
  # 5. APB Agent 回环随机测试
  # =========================================================================
  - name: "apb_loopback_random"
    build: "build_apb"
    count: 10
    local_vars:
      UVM_TEST: "apb_loopback_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "apb", "loopback", "random"]
    file_pattern:
      - "generated/verify_architect_test/agents/APB_agent/**"

  # =========================================================================
  # 6. APB 地址宽度矩阵测试
  # =========================================================================
  - name: "apb_addr_width"
    build: "build_apb"
    count: 2
    matrix:
      - { ADDR_WIDTH: [8, 16, 32] }
      - { DATA_WIDTH: [8, 16, 32] }
    name_format: "apb_A{ADDR_WIDTH}_D{DATA_WIDTH}"
    local_vars:
      UVM_TEST: "apb_loopback_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+ADDR_WIDTH=${ADDR_WIDTH}"
      - "+DATA_WIDTH=${DATA_WIDTH}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "apb", "matrix"]
    file_pattern:
      - "generated/verify_architect_test/agents/APB_agent/**"

  # =========================================================================
  # 7. UART 覆盖率收集
  # =========================================================================
  - name: "uart_coverage"
    build:
      name: "build_uart_cov"
      simulator: "questasim_cov"
      compile_opts:
        - "+incdir+{{ GEN_HOME }}/verify_architect_test/agents/UART_agent"
        - "+incdir+{{ GEN_HOME }}/verify_architect_test/env"
        - "+incdir+{{ GEN_HOME }}/verify_architect_test/env/tests"
        - "+define+COVERAGE"
      files:
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_pkg.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_interface.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_transaction.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_config.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_driver.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_monitor.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_sequencer.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_agent.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_base_seq.sv"
        - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_coverage_collector.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/uart_env_pkg.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/uart_env_config.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/uart_env.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/seqs/uart_env_seq_pkg.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/seqs/uart_env_virtual_sequencer.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/seqs/uart_env_virtual_base_seq.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_test_pkg.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_base_test.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_direct_test.sv"
        - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_random_test.sv"
        - "{{ GEN_HOME }}/verify_architect_test/bench/uart_env_bench_tb_top.sv"
      hooks:
        post_sim: |
          vcover merge -out uart_coverage.ucdb cov_data_*.ucdb
          vcover report -html -output uart_cov_report uart_coverage.ucdb
          echo "UART coverage report: uart_cov_report/"
    count: 1
    local_vars:
      UVM_TEST: "uart_env_random_test"
      COV: 1
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=UVM_NONE"
      - "+UVM_TIMEOUT=200000000000"
      - "+seed=${SEED}"
      - "-coverage"
    expect:
      errors: 0
    tags: ["coverage", "uart", "nightly"]
    file_pattern:
      - "generated/verify_architect_test/**"
