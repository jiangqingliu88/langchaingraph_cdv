# =============================================================================
# QuestaSim 回归测试 - ALU 模块全量回归
# =============================================================================
# 覆盖 ALU_in / ALU_out 两个 Agent 的所有测试场景。
# 包含: 回环测试、直接测试、随机测试、错误注入测试。
#
# 使用方式:
#   # 本地模拟 (仅打印命令, 不执行)
#   python regression.py --config config/regression/questa_alu_full.yaml --mode mock
#
#   # 本地执行
#   python regression.py --config config/regression/questa_alu_full.yaml --action all --mode local
#
#   # LSF 集群提交
#   python regression.py --config config/regression/questa_alu_full.yaml --action all --mode lsf --lsf-queue normal
#
#   # 仅生成脚本 (不执行)
#   python regression.py --config config/regression/questa_alu_full.yaml --action generate
#
#   # 只跑冒烟标签
#   python regression.py --config config/regression/questa_alu_full.yaml --mode local --tags smoke
#
#   # 命令行覆盖 seed
#   python regression.py --config config/regression/questa_alu_full.yaml --mode local --set global_vars.SEED=7777
# =============================================================================

extends: "questa_base.yaml"

# ---- 覆盖全局变量 ----
global_vars:
  SEED: 12345
  WAVES: 0
  COV: 0
  UVM_VERBOSITY: "UVM_LOW"
  UVM_TIMEOUT: "50000000000"   # 50ns

settings:
  default_count: 1

# =============================================================================
# ALU 测试用例定义
# =============================================================================
tests:

  # =========================================================================
  # 1. ALU_in Agent 回环测试 (Loopback)
  # =========================================================================
  - name: "alu_in_loopback_smoke"
    build: "build_alu_loopback"
    count: 1
    local_vars:
      UVM_TEST: "alu_in_loopback_test"
      WAVES: 1
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
      warnings: 0
    tags: ["smoke", "loopback", "alu_in", "fast"]
    file_pattern:
      - "generated/alu/agents/ALU_in/**"
      - "rtl/alu/**"

  - name: "alu_in_loopback_random"
    build: "build_alu_loopback"
    count: 5    # 5 个不同 seed 重复运行, SEED 自动递增
    local_vars:
      UVM_TEST: "alu_in_loopback_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "loopback", "alu_in", "random"]
    file_pattern:
      - "generated/alu/agents/ALU_in/**"
      - "rtl/alu/**"

  # =========================================================================
  # 2. ALU_out Agent 回环测试 (Loopback)
  # =========================================================================
  - name: "alu_out_loopback_smoke"
    build: "build_alu_loopback"
    count: 1
    local_vars:
      UVM_TEST: "alu_out_loopback_test"
      WAVES: 1
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
      warnings: 0
    tags: ["smoke", "loopback", "alu_out", "fast"]
    file_pattern:
      - "generated/alu/agents/ALU_out/**"
      - "rtl/alu/**"

  - name: "alu_out_loopback_random"
    build: "build_alu_loopback"
    count: 5
    local_vars:
      UVM_TEST: "alu_out_loopback_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "loopback", "alu_out", "random"]
    file_pattern:
      - "generated/alu/agents/ALU_out/**"
      - "rtl/alu/**"

  # =========================================================================
  # 3. ALU 运算模式矩阵测试 (Matrix 参数展开)
  # =========================================================================
  # 自动生成 4×4 = 16 个测试实例:
  #   alu_op_ADD_W8, alu_op_ADD_W16, alu_op_ADD_W32, alu_op_ADD_W64,
  #   alu_op_SUB_W8, ... alu_op_MUL_W64
  - name: "alu_op"
    build: "build_alu"
    count: 3    # 每个矩阵组合再跑 3 个 seed
    matrix:
      - { OP: ["ADD", "SUB", "MUL", "DIV"] }
      - { WIDTH: [8, 16, 32, 64] }
    name_format: "alu_op_{OP}_W{WIDTH}"
    local_vars:
      UVM_TEST: "alu_op_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+OP=${OP}"
      - "+WIDTH=${WIDTH}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "alu", "op", "matrix"]
    file_pattern:
      - "rtl/alu/**"

  # =========================================================================
  # 4. ALU 边界条件矩阵测试
  # =========================================================================
  - name: "alu_boundary"
    build: "build_alu"
    count: 2
    matrix:
      - { TEST_TYPE: ["overflow", "underflow", "zero", "max_val", "min_val"] }
      - { WIDTH: [8, 16, 32, 64] }
    name_format: "alu_boundary_{TEST_TYPE}_W{WIDTH}"
    local_vars:
      UVM_TEST: "alu_boundary_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+TEST_TYPE=${TEST_TYPE}"
      - "+WIDTH=${WIDTH}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["regression", "alu", "boundary", "matrix"]
    file_pattern:
      - "rtl/alu/**"

  # =========================================================================
  # 5. ALU 随机压力测试 (高种子数覆盖)
  # =========================================================================
  - name: "alu_stress_random"
    build: "build_alu"
    count: 50   # 高 seed 覆盖
    local_vars:
      UVM_TEST: "alu_random_stress_test"
      UVM_VERBOSITY: "UVM_NONE"    # 减少日志量
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=200000000000"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["stress", "random", "alu", "nightly"]
    file_pattern:
      - "rtl/alu/**"
      - "generated/alu/**"

  # =========================================================================
  # 6. ALU 错误注入测试
  # =========================================================================
  - name: "alu_error_inject"
    build: "build_alu"
    count: 1
    matrix:
      - { ERR_TYPE: ["protocol_violation", "data_corruption", "timing_error"] }
      - { TARGET: ["ALU_in", "ALU_out"] }
    name_format: "alu_err_{ERR_TYPE}_{TARGET}"
    local_vars:
      UVM_TEST: "alu_error_inject_test"
      WAVES: 1    # 错误注入测试始终保存波形
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+ERR_TYPE=${ERR_TYPE}"
      - "+TARGET=${TARGET}"
      - "+seed=${SEED}"
    expect:
      errors: "any"    # 接受任何结果 (手动检查)
    tags: ["error_inject", "alu", "debug"]
    file_pattern:
      - "generated/alu/agents/${TARGET}/**"
      - "rtl/alu/**"

  # =========================================================================
  # 7. 覆盖率收集测试 (单次运行收集所有覆盖率)
  # =========================================================================
  - name: "alu_coverage_collect"
    build:
      name: "build_alu_cov"
      simulator: "questasim_cov"
      compile_opts:
        - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_in"
        - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_out"
        - "+incdir+{{ GEN_HOME }}/alu/env"
        - "+define+COVERAGE"
      files:
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_pkg.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_interface.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_transaction.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_config.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_driver.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_monitor.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_sequencer.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_agent.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_base_seq.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_coverage_collector.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_pkg.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_interface.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_transaction.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_config.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_driver.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_monitor.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_sequencer.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_agent.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_base_seq.sv"
        - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_coverage_collector.sv"
        - "{{ GEN_HOME }}/alu/env/alu.sv"
        - "{{ GEN_HOME }}/alu/bench/alu_bench_tb_top.sv"
      hooks:
        post_build: "echo 'Coverage build done'"
        post_sim: |
          vcover merge -out merged_coverage.ucdb cov_data_*.ucdb
          vcover report -html -output cov_report merged_coverage.ucdb
          echo "Coverage report generated in cov_report/"
    count: 1
    local_vars:
      UVM_TEST: "alu_coverage_test"
      COV: 1
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=UVM_NONE"
      - "+UVM_TIMEOUT=100000000000"
      - "+seed=${SEED}"
      - "-coverage"
      - "-covfile cov.cfg"
    expect:
      errors: 0
    tags: ["coverage", "alu", "nightly"]
    file_pattern:
      - "rtl/alu/**"
      - "generated/alu/**"
