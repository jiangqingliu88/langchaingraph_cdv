# =============================================================================
# QuestaSim 回归测试 - 冒烟测试 (Smoke Test)
# =============================================================================
# 快速验证关键通路，每个 Agent 只跑 1 个种子，总耗时 < 5 分钟。
# 适用于: 每次 commit 后快速检查、CI/CD pipeline。
#
# 使用方式:
#   python regression.py --config config/regression/questa_smoke.yaml --mode local
#   python regression.py --config config/regression/questa_smoke.yaml --mode mock  # 干跑
#   python regression.py --config config/regression/questa_smoke.yaml --mode lsf --lsf-queue short
# =============================================================================

extends: "questa_base.yaml"

global_vars:
  SEED: 1
  WAVES: 0
  COV: 0
  UVM_VERBOSITY: "UVM_NONE"
  UVM_TIMEOUT: "10000000000"

settings:
  default_count: 1
  default_simulator: "questasim"

tests:

  # ---- ALU_in 回环冒烟 ----
  - name: "smoke_alu_in_lb"
    build: "build_alu_loopback"
    count: 1
    local_vars:
      UVM_TEST: "alu_in_loopback_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["smoke", "fast", "ci"]

  # ---- ALU_out 回环冒烟 ----
  - name: "smoke_alu_out_lb"
    build: "build_alu_loopback"
    count: 1
    local_vars:
      UVM_TEST: "alu_out_loopback_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["smoke", "fast", "ci"]

  # ---- ALU 运算基础 (仅 ADD/W8 一组) ----
  - name: "smoke_alu_op_add_w8"
    build: "build_alu"
    count: 1
    local_vars:
      UVM_TEST: "alu_op_test"
      OP: "ADD"
      WIDTH: 8
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+OP=${OP}"
      - "+WIDTH=${WIDTH}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["smoke", "fast", "ci"]

  # ---- UART 回环冒烟 ----
  - name: "smoke_uart_lb"
    build: "build_uart"
    count: 1
    local_vars:
      UVM_TEST: "uart_env_base_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
      warnings: 0
    tags: ["smoke", "fast", "ci"]

  # ---- APB Agent 回环冒烟 ----
  - name: "smoke_apb_lb"
    build: "build_apb"
    count: 1
    local_vars:
      UVM_TEST: "apb_loopback_test"
    run_opts:
      - "+UVM_TESTNAME=${UVM_TEST}"
      - "+UVM_VERBOSITY=${UVM_VERBOSITY}"
      - "+UVM_TIMEOUT=${UVM_TIMEOUT}"
      - "+seed=${SEED}"
    expect:
      errors: 0
    tags: ["smoke", "fast", "ci"]
