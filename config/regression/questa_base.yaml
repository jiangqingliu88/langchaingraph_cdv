# =============================================================================
# QuestaSim 回归测试 - 基础配置
# =============================================================================
# 此文件定义 QuestaSim 仿真器的编译/运行命令模板、全局变量和共享设置。
# 其他 YAML 可通过 `extends: questa_base.yaml` 继承此配置。
#
# 使用方式:
#   python regression.py --config config/regression/questa_alu_full.yaml --mode local
#   python regression.py --config config/regression/questa_smoke.yaml --mode lsf --lsf-queue normal
# =============================================================================

global_vars:
  # ---- 仿真根目录 ----
  PROJ_HOME: "D:/cdv_a"
  GEN_HOME: "D:/cdv_a/generated"

  # ---- 种子与波形 ----
  SEED: 12345
  WAVES: 0             # 0=不保存波形, 1=保存波形(仅失败时)
  COV: 0               # 0=不收集覆盖率, 1=收集覆盖率

  # ---- UVM 通用配置 ----
  UVM_VERBOSITY: "UVM_LOW"
  UVM_TIMEOUT: "10000000000"   # 10s 超时 (1ns/timescale)

settings:
  # ---- 默认值 ----
  default_build: "build_alu"
  default_count: 1
  default_simulator: "questasim"

  # ---- 编译缓存 ----
  build_cache: true

  # ---- 失败重试 ----
  retry: 0

  # ---- QuestaSim 仿真器命令模板 ----
  # {opts}    → compile_opts 展开后的字符串
  # {files}   → files 列表展开后的字符串
  # {run_opts} → run_opts 展开后的字符串
  simulators:

    # ---- 标准 QuestaSim (单库 work) ----
    questasim:
      compile: "vlog -sv -work work +acc +define+QUESTA {opts} {files}"
      run:     "vsim -c -do \"run -all; quit -f\" -sv_seed $SEED {run_opts} work.tb_top"

    # ---- QuestaSim + UVM (预编译 UVM 库) ----
    questasim_uvm:
      compile: "vlog -sv -work work -mfcu +acc +define+QUESTA +incdir+$UVM_HOME/src {opts} {files}"
      run:     "vsim -c -do \"run -all; quit -f\" -sv_seed $SEED +UVM_VERBOSITY=$UVM_VERBOSITY +UVM_TESTNAME=$UVM_TEST {run_opts} work.tb_top"

    # ---- QuestaSim + Coverage ----
    questasim_cov:
      compile: "vlog -sv -work work +acc +cover=sbceft +define+QUESTA +define+COVERAGE {opts} {files}"
      run:     "vsim -c -do \"coverage save -onexit cov_data.ucdb; run -all; quit -f\" -sv_seed $SEED -coverage {run_opts} work.tb_top"

    # ---- QuestaSim + 波形调试 ----
    questasim_debug:
      compile: "vlog -sv -work work +acc +define+QUESTA +define+DEBUG {opts} {files}"
      run:     "vsim -c -do \"log -r /*; run -all; quit -f\" -sv_seed $SEED -wlf wave.wlf {run_opts} work.tb_top"

  # ---- 全局钩子脚本 ----
  hooks:
    # 每次回归前：创建 QuestaSim 工作库
    pre_build: |
      if [ -d work ]; then vdel -lib work -all; fi
      vlib work
      vmap work work

  # ---- LSF 集群默认选项 ----
  lsf_opts:
    queue: "normal"
    resource: "rusage[mem=8192]"

# =============================================================================
# 编译任务定义 (builds)
# =============================================================================
# 每个 build 对应一组 RTL 文件 + 编译选项，生成一个独立的工作目录。
# 多个 test 可共享同一个 build。
builds:

  # ---- 基础 ALU 编译 ----
  - name: "build_alu"
    simulator: "questasim"
    compile_opts:
      - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_in"
      - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_out"
      - "+incdir+{{ GEN_HOME }}/alu/env"
    files:
      # ALU_in Agent
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_pkg.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_interface.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_transaction.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_config.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_driver.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_monitor.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_sequencer.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_agent.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_base_seq.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_coverage_collector.sv"
      # ALU_out Agent
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_pkg.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_interface.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_transaction.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_config.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_driver.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_monitor.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_sequencer.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_agent.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_base_seq.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_coverage_collector.sv"
      # Env
      - "{{ GEN_HOME }}/alu/env/alu.sv"
      # Bench
      - "{{ GEN_HOME }}/alu/bench/alu_bench_tb_top.sv"
    hooks:
      post_build: |
        echo "Build alu_base completed at $(date)"

  # ---- ALU 回环测试编译 ----
  - name: "build_alu_loopback"
    simulator: "questasim"
    compile_opts:
      - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_in"
      - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_out"
      - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_in/loopback"
      - "+incdir+{{ GEN_HOME }}/alu/agents/ALU_out/loopback"
      - "+incdir+{{ GEN_HOME }}/alu/env"
    files:
      # ALU_in Agent (含 loopback components)
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_pkg.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_interface.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_transaction.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_config.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_driver.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_monitor.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_sequencer.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_agent.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_base_seq.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/ALU_in_coverage_collector.sv"
      # Loopback env for ALU_in
      - "{{ GEN_HOME }}/alu/agents/ALU_in/loopback/ALU_in_loopback_env.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/loopback/ALU_in_loopback_scb.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/loopback/ALU_in_loopback_test.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_in/loopback/ALU_in_loopback_tb.sv"
      # ALU_out Agent (含 loopback components)
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_pkg.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_interface.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_transaction.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_config.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_driver.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_monitor.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_sequencer.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_agent.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_base_seq.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/ALU_out_coverage_collector.sv"
      # Loopback env for ALU_out
      - "{{ GEN_HOME }}/alu/agents/ALU_out/loopback/ALU_out_loopback_env.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/loopback/ALU_out_loopback_scb.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/loopback/ALU_out_loopback_test.sv"
      - "{{ GEN_HOME }}/alu/agents/ALU_out/loopback/ALU_out_loopback_tb.sv"
    hooks:
      post_build: |
        echo "Build alu_loopback completed at $(date)"

  # ---- UART Agent 编译 ----
  - name: "build_uart"
    simulator: "questasim_uvm"
    compile_opts:
      - "+incdir+{{ GEN_HOME }}/verify_architect_test/agents/UART_agent"
      - "+incdir+{{ GEN_HOME }}/verify_architect_test/env"
      - "+incdir+{{ GEN_HOME }}/verify_architect_test/env/tests"
    files:
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_pkg.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_interface.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_transaction.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_config.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_driver.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_monitor.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_sequencer.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_agent.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_base_seq.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/UART_agent/UART_agent_coverage_collector.sv"
      # Env
      - "{{ GEN_HOME }}/verify_architect_test/env/uart_env_pkg.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/uart_env_config.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/uart_env.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/seqs/uart_env_seq_pkg.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/seqs/uart_env_virtual_sequencer.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/seqs/uart_env_virtual_base_seq.sv"
      # Tests
      - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_test_pkg.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_base_test.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_direct_test.sv"
      - "{{ GEN_HOME }}/verify_architect_test/env/tests/uart_env_random_test.sv"
      # Bench
      - "{{ GEN_HOME }}/verify_architect_test/bench/uart_env_bench_tb_top.sv"

  # ---- APB Agent 编译 ----
  - name: "build_apb"
    simulator: "questasim"
    compile_opts:
      - "+incdir+{{ GEN_HOME }}/verify_architect_test/agents/APB_agent"
    files:
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_pkg.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_interface.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_transaction.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_config.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_driver.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_monitor.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_sequencer.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_agent.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_base_seq.sv"
      - "{{ GEN_HOME }}/verify_architect_test/agents/APB_agent/APB_agent_coverage_collector.sv"

# =============================================================================
# 通用测试用例 (其他 YAML 可通过 include 引用并扩展)
# =============================================================================
tests: []
# 测试用例在各子配置中定义。此文件仅定义基础设施。
