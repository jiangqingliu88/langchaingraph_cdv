# ════════════════════════════════════════════════════════════════
# 最小可跑的 DSL —— 七段里只有 `meta` 是必填的
#
# 用途有两个：
#   1. 「这个工具到底需要多少输入才能跑」的答案
#   2. **校验**的活样本：跑 `validate` 看它全绿，再逐段加、看每加一段
#      多出什么效果
#
# 用法:
#   python -m src.tools.generation.isa_gen_tools.cli validate config/isa_gen/examples/minimal.yaml
#   python -m src.tools.generation.isa_gen_tools.cli compile  config/isa_gen/examples/minimal.yaml
# ════════════════════════════════════════════════════════════════

# `meta.name` 是唯一必填项 —— 它是 case 的标识，落盘目录要用它。
# `seed` 留空则取时间戳，**实际用的值会回填进 case.json**（文档字段约定第 1 条）：
# 不回填的话，"这次跑的是哪个 seed"就没记录了，可复现链断在这里。
meta:
  name: minimal
