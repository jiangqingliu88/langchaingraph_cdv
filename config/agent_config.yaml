# Agent配置 - 定义9个Agent的能力和协作关系
agents:
  verification_orchestrator:
    role: "verification_orchestrator"
    display_name: "验证编排器"
    description: "项目管理核心，负责任务分解和资源调度"
    priority: 1
    tools:
      - create_task
      - query_agent_status
      - update_project_status
      - make_decision
    collaborators:
      - spec
      - uvm
      - regress_cov
      - qa
    
  spec:
    role: "spec"
    display_name: "规格与测试规划师"
    description: "分析设计规格，生成验证计划"
    priority: 2
    tools:
      - analyze_specification
      - generate_test_plan
      - extract_features
    collaborators:
      - uvm
      - design
      - test
    
  uvm:
    role: "uvm"
    display_name: "验证架构师"
    description: "设计UVM验证环境架构并生成组件代码"
    priority: 3
    tools:
      - generate_uvm_architecture
      - generate_uvm_driver
      - generate_uvm_monitor
      - generate_uvm_scoreboard
      - generate_uvm_agent
    collaborators:
      - sequence_engineer
      - assert
      - regress_cov
    
  design:
    role: "design"
    display_name: "设计架构师"
    description: "模块 Spec → function hierarchy + register map + RTL hierarchy"
    priority: 2
    tools:
      - analyze_specification
      - generate_function_hierarchy
      - generate_register_map
    collaborators:
      - spec
      - uvm

  model:
    role: "model"
    display_name: "参考模型工程师"
    description: "生成 C++/SC 参考模型用于 Scoreboard 比对"
    priority: 3
    tools:
      - generate_reference_model
      - generate_predictor
      - validate_model
    collaborators:
      - design
      - uvm

  test:
    role: "test"
    display_name: "测试工程师"
    description: "写case + 功能覆盖率点 + 约束策略→场景映射→SV代码 一站式生成"
    priority: 4
    tools:
      - parse_test_points
      - map_policies_to_tests
      - build_scenario_yaml
      - generate_coverage_points
      - generate_test_cases
      - check_test_coverage
    collaborators:
      - uvm
      - regress_cov
    
  assert:
    role: "assert"
    display_name: "断言工程师"
    description: "生成SVA断言和形式验证属性"
    priority: 4
    tools:
      - generate_sva_assertions
      - generate_formal_properties
      - check_assertion_coverage
    collaborators:
      - uvm
      - debug
    
  regress_cov:
    role: "regress_cov"
    display_name: "回归与覆盖率管理器"
    description: "编译仿真→收集覆盖率→分析gap→建议增补case，闭环迭代直到覆盖率收敛"
    priority: 5
    tools:
      - compile_env
      - run_simulation
      - generate_regression_report
      - collect_coverage
      - analyze_coverage_gaps
      - suggest_coverage_tests
    collaborators:
      - test
      - debug
    
  debug:
    role: "debug"
    display_name: "调试工程师"
    description: "分析失败测试，定位问题根因"
    priority: 6
    tools:
      - analyze_simulation_log
      - analyze_waveform
      - trace_error_source
      - generate_fix_suggestion
    collaborators:
      - regress_cov
      - assert
    
  qa:
    role: "qa"
    display_name: "质量保证"
    description: "代码审查和验证质量评估"
    priority: 7
    tools:
      - review_code
      - evaluate_quality_metrics
      - check_standards_compliance
      - generate_qa_report
    collaborators:
      - verification_orchestrator
      - regress_cov

# 验证流程定义
pipelines:
  full_verification:
    name: "完整验证流程（10 阶段，含 regress_cov 闭环 + docs 并行合并）"
    phases:
      - name: "spec_analysis"
        agent: "spec"
        next: "designure"
      - name: "designure"
        agent: "design"
        next: "architecture_design"
      - name: "architecture_design"
        agent: "uvm"
        next: "model_generation"
      - name: "model_generation"
        agent: "model"
        next: "parallel_development"
      - name: "parallel_development"
        parallel: true
        agents:
          - "test"
          - "assert"
        next: "regress_cov"
      - name: "regress_cov"
        agent: "regress_cov"
        retry_on_gap: true
        max_retries: 2
        next: "debug_analysis"
      - name: "debug_analysis"
        agent: "debug"
        next: "docs"
      - name: "docs"
        parallel: true
        doc_types: ["ifspec", "rtlsign", "vplan", "tpoint", "rtm"]
        description: "5 类文档并行生成 (基于 regress_cov 实际覆盖率数据)"
        next: "quality_review"
      - name: "quality_review"
        agent: "qa"
        next: "decision"
      - name: "decision"
        agent: "verification_orchestrator"

  quick_check:
    name: "快速检查流程（5 阶段）"
    phases:
      - name: "spec_analysis"
        agent: "spec"
        next: "designure"
      - name: "designure"
        agent: "design"
        next: "architecture_design"
      - name: "architecture_design"
        agent: "uvm"
        next: "test_generation"
      - name: "test_generation"
        agent: "test"
        next: "regress_cov"
      - name: "regress_cov"
        agent: "regress_cov"
        retry_on_gap: true
        max_retries: 1