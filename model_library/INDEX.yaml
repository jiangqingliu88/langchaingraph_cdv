# 黄金参考模型库索引（Golden Reference Model Library INDEX）
#
# 使用约定：
#   1. 入库必须验证（scripts/model_library_verify.py 定向仿真 matched==N && mismatched==0）
#   2. 模型不可变：只能新增版本（v2/v3...），禁止修改已发布版本
#   3. model agent 按 spec 特征匹配本索引，命中 → 加载参数化；未命中 → 诚实占位
# 维护命令：python scripts/model_library_import.py <ip> <version>

apb_slave:
  versions: [v1]
  active: v1
  matched_features: [apb, 寄存器, register, paddr, pwdata, prdata, psel, penable]

uart_tx:
  versions: [v1]
  active: v1
  matched_features: [uart, tx, 串行, 发送, baud]

uart_rx:
  versions: [v1]
  active: v1
  matched_features: [uart, rx, 串行, 接收, baud]

fifo16:
  versions: [v1]
  active: v1
  matched_features: [fifo, 缓冲, 队列, wr_en, rd_en, full, empty, overflow]

irq_gen:
  versions: [v1]
  active: v1
  matched_features: [irq, intr, 中断, interrupt, irq_src, irq_en, irq_pending]
