[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-verification-agent"
version = "1.0.0"
description = "IC Verification Multi-Agent System"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langchain==0.1.20",
    "langchain-core==0.1.52",
    "langchain-openai==0.0.8",
    "langchain-community==0.0.38",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19.0",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "structlog>=23.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.1.0",
]

[project.scripts]
ic-verify = "src.cli.commands:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]