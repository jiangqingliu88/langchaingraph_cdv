[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signoffai"
version = "1.0.0"
description = "SignOffAI — IC 功能设计验证签核平台"
requires-python = ">=3.10,<3.13"
dependencies = [
    "langchain==0.1.20",
    "langchain-core==0.1.52",
    "langchain-openai==0.0.8",
    "langchain-community==0.0.38",
    "jinja2>=3.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19.0",
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "tenacity>=8.0",
    "structlog>=23.0",
    "python-dotenv>=1.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "PyJWT>=2.8.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.1.0",
]

[project.scripts]
vagent = "src.cli.commands:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short", "--strict-markers", "-p no:warnings"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring DB",
    "slow: Slow running tests",
    "api: API endpoint tests",
]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", "__pycache__", ".git", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]