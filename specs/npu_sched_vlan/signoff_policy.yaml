# 模块级签核策略 —— 与规格同版本、进证据包 inputs/
#
# 判据：签核结论 = 硬门禁 + **未被接受的 caveat**。
# 一条 caveat 只有在这里显式 accepted: true 才不参与结论；接受必须带审批人与理由，
# 否则和"把文案删掉"没有区别。
#
# 查找顺序（audit 自动）：
#   1. <run>/signoff_policy.yaml
#   2. specs/<module>/signoff_policy.yaml     ← 本文件
#   3. config/signoff_policy/<module>.yaml
schema: signoff_policy_v1
module: npu_sched

# 本模块是否必须有一个 verified 参考模型才允许签核。
# 默认 false：参考模型层正在迁移（SQL TLM 1.0），在补齐 verified 模型前
# 把所有 run 都阻断，等于让签核功能不可用。
require_ref_model: false

# 签核必须引用 lineage 基线；缺失即 NEEDS_FIX（不是 caveat）。
# audit 会在首次运行时自动锚定基线，正常不会缺。
require_baseline: true

# 已知 caveat 码：
#   CONSTRAINT_PARTIAL / CONSTRAINT_INACTIVE
#   UCDB_NO_BINS / CG_DUT_ZERO
#   ASSOCIATION_HARD_EDGE / TP_UNMAPPED / TP_TRACE_INCOMPLETE / TP_MISSED
#   MODEL_UNAVAILABLE / BASELINE_MISSING
#
# 全部默认不接受（不写 = false）。要接受某条，写成：
#   TP_MISSED:
#     accepted: true
#     approver: <姓名>
#     reason: <为什么这条缺口可以带着签>
accepted_caveats: {}
