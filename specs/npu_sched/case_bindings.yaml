# Case 绑定表 —— 业务测试点表（xlsx）→ 覆盖模型（casemodel）的**唯一桥**。
#
# 每条 CASE 只填 dimensions / cells / tests：
#   dimensions: 该用例覆盖的 casemodel 维度（D_type / D_dep / D_seq …）
#   cells:      期望签核的 CELL（可由 cell_matrix 派生；留空则不声明）
#   tests:      UVM 测试类（xlsx 的 TestName 多数是 func_cov监测，不是类名）
#
# 没填的 CASE 会被门禁报 `case_without_binding` —— **不自动猜**。
# 填完后在 casemodel.yaml 声明：
#   case_source:
#     xlsx: src/tools/humanview/aivm_ir/example/NPU_V2.CMDSCHED.testpoint.xlsx
#     bindings: specs/npu_sched/case_bindings.yaml
#     module: NPU_V2-CMDSCHED
