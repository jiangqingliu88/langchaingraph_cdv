# ALU_out.yaml — ALU 输出接口
interfaces:
    name: ALU_out
    clock: clk
    reset: rst

    parameters:
      - { name: DATA_WIDTH, type: int, value: '32' }
      - { name: FLAGS_WIDTH, type: int, value: '4' }
      - { name: ALU_OP_WIDTH, type: int, value: '4' }

    hdl_typedefs:
      - name: alu_flags_t
        type: "struct packed { logic N; logic Z; logic C; logic V; }"

    hvl_typedefs:
      - name: alu_result_t
        type: "bit [DATA_WIDTH-1:0]"

    ports:
      - { name: clk,    dir: input,  width: 1 }
      - { name: rst,    dir: input,  width: 1 }
      - { name: result, dir: input,  width: DATA_WIDTH }
      - { name: flags,  dir: input,  width: FLAGS_WIDTH }
      - { name: valid,  dir: input,  width: 1 }
      - { name: ready,  dir: output, width: 1 }

    transaction_vars:
      - { name: result, type: "bit [DATA_WIDTH-1:0]", iscompare: 'True', isrand: 'False' }
      - { name: flags,  type: "bit [FLAGS_WIDTH-1:0]",  iscompare: 'True', isrand: 'False' }
      - { name: valid,  type: bit,                      iscompare: 'False', isrand: 'False' }

    transaction_constraints:
      - name: passive_c
        value: '{ }'

    config_vars:
      - { name: enable_coverage, type: bit, value: "1'b1" }
