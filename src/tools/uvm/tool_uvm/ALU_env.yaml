environment:
  # 环境基本信息
  name: alu_env
  # 时钟复位接口连接
  clk_rst:
    interface: clk_rst_if
    clocks: [sys_clk, fast_clk]
    resets: [sys_rst_n, por_rst_n]
  
  # Agent 接口连接
  agents:
    ALU_in:
      interface: alu_in_interface
      clock: sys_clk
      reset: sys_rst_n
      
    ALU_out:
      interface: alu_out_interface
      clock: sys_clk
      reset: sys_rst_n
  # Scoreboard 列表
  scoreboards:
    - name: alu_scoreboard
      type: uvm_in_order_class_comparator
      transaction_type: ALU_out_transaction
      enabled: true
      
    - name: alu_coverage_collector
      type: alu_coverage
      transaction_type: ALU_in_transaction
      enabled: true

  # Virtual Sequencer 配置
  virtual_sequencer:
    enabled: true
    name: alu_env_virtual_sequencer

  # 环境配置变量
  config_vars:
    - name: has_scoreboard
      type: bit
      value: 1
    - name: has_functional_coverage
      type: bit
      value: 1
    - name: has_virtual_sequencer
      type: bit
      value: 1
    - name: num_transactions
      type: int
      value: 100
      
  # 环境配置约束
  config_constraints:
    - name: env_config_valid_c
      value: '{ has_scoreboard == 1 -> has_functional_coverage == 1; }'
    - name: transaction_limit_c
      value: '{ num_transactions inside {[1:1000]}; }'

  # TLM 连接配置
  tlm_connections:
    - from: ALU_in_agent_h.mon.item_collected_port
      to: alu_scoreboard_h.analysis_export
    - from: ALU_out_agent_h.mon.item_collected_port
      to: alu_scoreboard_h.expected_export
    - from: ALU_in_agent_h.mon.item_collected_port
      to: alu_coverage_collector_h.analysis_export