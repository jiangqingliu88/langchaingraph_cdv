# predictor.yaml
# Predictor 组件配置
util_components:
  # ─── ALU Predictor ───
    - name: ALU_predictor0
      type: uvm_component
      description: "ALU 预测器0:接收输入 transaction，预测输出结果"
      analysis_exports:
        - name: ALU_in_agent_ae
          type: 'ALU_in_transaction'

      analysis_ports:
        - name: ALU_sb_ap
          type: 'ALU_out_transaction'
          
    - name: ALU_predictor1
      type: uvm_component
      description: "ALU 预测器：接收输入 transaction，预测输出结果"
      analysis_exports:
        - name: ALU_in_agent_ae
          type: 'ALU_in_transaction'

      analysis_ports:
        - name: ALU_sb_ap
          type: 'ALU_out_transaction'
          


