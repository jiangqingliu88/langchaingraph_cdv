bench:
  # 基本信息
  name: alu_bench
  # 环境名称
  env_name: alu
  # 系统配置
  timeout: 10ms

  # 是否包含断言
  include_assertions: true

  # 时钟复位配置
  clk_rst:
    interface: clk_rst_if
    clocks:
      - { name: clk, period: 10ns, init: 0 }
    resets:
      - { name: rst_n, init: 0, release_delay: 0 }

  # 信号线声明
  wire_decls:
    - { name: alu_a,             width: 32 }
    - { name: alu_b,             width: 32 }
    - { name: alu_op,            width: 4 }
    - { name: alu_result,        width: 32 }
    - { name: alu_result_wide,   width: 64 }
    - { name: alu_valid_in,      width: 1 }
    - { name: alu_ready,         width: 1 }
    - { name: alu_valid_out,     width: 1 }
    - { name: alu_flags,         width: 4 }
    - { name: alu_out_ready_tie, width: 1 }

  # 连续赋值
  assignments:
    - { lhs: alu_out_ready_tie, rhs: "1'b0" }
    - { lhs: alu_result_wide,   rhs: "{32'b0, alu_result}" }

  # Agent 接口实例化
  agents:
    ALU_in:
      interface: ALU_in
      clock: clk
      reset: rst_n
      instance: ALU_in_if
      connections:
        - { port: clk,    wire: clk }
        - { port: rst,    wire: rst_n }
        - { port: a,      wire: alu_a }
        - { port: b,      wire: alu_b }
        - { port: op,     wire: alu_op }
        - { port: valid,  wire: alu_valid_in }
        - { port: ready,  wire: alu_ready }
        - { port: result, wire: alu_result_wide }
    ALU_out:
      interface: ALU_out
      clock: clk
      reset: rst_n
      instance: ALU_out_if
      connections:
        - { port: clk,    wire: clk }
        - { port: rst,    wire: rst_n }
        - { port: result, wire: alu_result }
        - { port: flags,  wire: alu_flags }
        - { port: valid,  wire: alu_valid_out }
        - { port: ready,  wire: alu_out_ready_tie }

  # DUT 实例化
  dut:
    module: alu
    instance: u_alu
    parameters:
      - { name: DATA_WIDTH, value: 32 }
      - { name: OP_WIDTH,   value: 4 }
    ports:
      - { name: clk,       connection: clk }
      - { name: rst_n,     connection: rst_n }
      - { name: a,         connection: alu_a }
      - { name: b,         connection: alu_b }
      - { name: op,        connection: alu_op }
      - { name: valid_in,  connection: alu_valid_in }
      - { name: ready_out, connection: alu_ready }
      - { name: result,    connection: alu_result }
      - { name: flags,     connection: alu_flags }
      - { name: valid_out, connection: alu_valid_out }

  # UVM 配置
  uvm_config:
    verbosity: UVM_MEDIUM
    report_handler:
      max_quit_count: 100
    factory_debug: false

  # 波形转储
  wave_dump:
    enabled: true
    format: "FST"
    file_name: "alu_bench_tb_top.fst"
    levels: 0
    plusargs: "DUMP_WAVES"

  # 仿真控制
  simulation:
    seed: 0
    max_runtime: 100ms
    stop_on_error: false
    stop_on_fatal: true
