# ============================================================
# Bench 定义 —— 顶层 testbench（clk_rst_if 实例化 + DUT + UVM 启动 + 波形）
# ============================================================

bench:
  name: APB_bench
  env_name: APB_env
  timeout: 10ms
  include_assertions: false

  # ── 时钟复位（bench 级，tb_top 实例化 clk_rst_if；clk/rst 由环境 clk_rst_agent 驱动）──
  clk_rst:
    clocks:
      - { name: pclk, period: "10ns", init: 0 }
    resets:
      - { name: presetn, init: 0, release_delay: 100 }

  dut_instance: u_dut          # DUT 实例名（tb_top 按 harness.bind_to 例化 DUT）
  # ── Harness（bind 式自连接）──
  #   bind 各 interface 到 DUT module（按 module 名，所有实例生效）；
  harness:
    name: apb_harness
    bind_to: apb_slave_dut
    interfaces:
      - name: apb_if
        type: apb_interface
        agent_path: "apb_master_agent_h"
        connections:
          pclk: pclk
          presetn: presetn
          paddr: paddr
          pwrite: pwrite
          psel: psel
          penable: penable
          pwdata: pwdata
          prdata: prdata
          pready: pready
          pslverr: pslverr
    # 每个 interface 自动生成 force/release 控制块：<if>_force_en 缺省 0，
    # 测试里置 1 后把 DUT 信号 force 成接口信号（无需 YAML 配置）

  # ── UVM 配置 ──
  uvm_config:
    verbosity: UVM_MEDIUM

  # ── 波形 ──
  wave_dump:
    enabled: true
    format: FST
    file_name: apb_tb_top.fst
    levels: 0
    plusargs: DUMP_WAVES

