# ============================================================
# Constraint 定义 —— 多端口事务组合场景（策略 + 组合器 + 协调序列）
# ============================================================
# 生成 5 个文件到 env/cons/:
#   {env}_constraint_policy.sv       策略上下文 + 策略基类
#   {project}_constraint_policies.sv 各策略实现（内置名有默认 apply 逻辑，自定义名为骨架）
#   {project}_policy_combinator.sv   组合器（APPLY_ALL/WEIGHTED/FIRST_MATCH/SEQUENTIAL/CHAIN）
#   {project}_policy_factory.sv      工厂（plusargs 选择策略列表）
#   {project}_coordinated_sequence.sv 协调序列（生成-入队-发送-超时-统计）
# ============================================================
# 多端口组合写法:
#   transactions: 每个端口一项，name 必须与 env agents 名一致
#     （coordinated_sequence 通过 p_sequencer.<name>_sqr 发送该端口事务）
#   policies.applies_to: 列出参与组合的端口名（多端口 = 列出多个）
# 内置策略名（有默认 apply 逻辑）: precision_consistency / mem_capacity /
#   data_dependency / boundary_overflow / concurrent_access / power_performance /
#   compute_mode —— 它们的事务名约定为 cfg/weight/input/output；
#   自定义策略名 → 生成空 apply 骨架（手填协议逻辑），语义校验层会提示。
# ============================================================

constraint:
  name: apb_cons
  env_name: APB_env

transactions:
  # 当前 APB env 只有一个 agent；多端口项目在此列出每个端口:
  #   - { name: usb_master, type: USB_master_seq_item }
  #   - { name: mem_master, type: MEM_master_seq_item }
  - { name: apb_master, type: APB_master_seq_item }

policies:
  - name: apb_addr_align            # 自定义名 → 空 apply 骨架（手填协议逻辑）
    description: "APB 地址 4 字节对齐（组合示例: applies_to 可列多个端口）"
    priority: 10
    params:
      - { name: align, type: int, default: 4 }
    applies_to: [apb_master]

  - name: apb_b2b_write
    description: "背靠背写组合（与 addr_align 在 APPLY_ALL 下同时生效）"
    priority: 20
    params: []
    applies_to: [apb_master]

combinator:
  default_mode: APPLY_ALL
  modes: [APPLY_ALL, APPLY_WEIGHTED, APPLY_FIRST_MATCH, APPLY_SEQUENTIAL, APPLY_CHAIN]
