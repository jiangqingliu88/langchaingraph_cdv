# ============================================================
# Bench 定义 —— 顶层 testbench（clk_rst_if 实例化 + DUT + UVM 启动）
# ============================================================

bench:
  name: APB_bench
  env_name: APB_env
  timeout: 10ms
  include_assertions: false

  # ── 时钟复位（bench 级，tb_top 按此实例化 clk_rst_if；
  #   周期/释放时机在 apb_env.yaml 的 clk_rst_vip 里配置，由 clk_rst_agent 驱动）──
  clk_rst:
    clocks:
      - { name: pclk }
    resets:
      - { name: presetn }

  dut_instance: u_dut          # DUT 实例名（tb_top 按 harness.bind_to 例化 DUT）
  # ── Harness（bind 式自连接）──
  #   bind 各 interface 到 DUT module（按 module 名，所有实例生效）；
  harness:
    name: apb_harness
    bind_to: apb_slave_dut
    interfaces:
      - name: apb_if
        type: apb_interface
        agent_path: "apb_master_agent_h"
        connections:
          pclk: pclk
          presetn: presetn
          paddr: paddr
          pwrite: pwrite
          psel: psel
          penable: penable
          pwdata: pwdata
          prdata: prdata
          pready: pready
          pslverr: pslverr


