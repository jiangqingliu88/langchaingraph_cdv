# ============================================================
# Interface (agent) 定义 —— 单个接口 → 生成 master/slave 两个 agent
# ============================================================
# ── 文件头元数据（可选）──
#   所有生成文件继承 templates/base_templates/base_template.sv.j2，
#   包含: 公司商标/权利声明/作者/创建时间/修改时间/联系邮箱/描述。
#   顶层 meta: 键可覆盖默认值（DEFAULT_META，见 gen_uvm.py）:
# meta:
#   company: "SignOffAI（功能签核）"
#   rights:  "Copyright © 2026 SignOffAI. All rights reserved."
#   author:  "你的名字"
#   email:   "you@example.com"
#   created: "2026-09-01"          # 固定创建时间（缺省 = 生成时刻）
#   modified: ""                   # 修改时间（缺省 = 生成时刻）
# dir 语义（AXI-VIP 风格）:
#   output = master 驱动、slave 采样（master → slave 的通道）
#   input  = slave 驱动、master 采样（slave → master 的通道）
# ============================================================
# 类命名约定: <name>_<role>_<kind>
#   共享:   <name>_config_base/master_config/slave_config/system_config,
#           <name>_master_seq_item/slave_seq_item
#   角色:   <name>_master_agent/driver/monitor/sequencer/sequence
#           <name>_slave_agent/driver/monitor/sequencer/sequence
# ============================================================

interfaces:
  - name: vpu_ctrl                # 协议/agent 名（生成类前缀 apb_）
    interface: vpu_ctrl           # 接口名（缺省 = name）
    clock: pclk
    reset: presetn
    protocol: apb            # 协议名 → 渲染协议正确的默认驱动/采样时序（两拍 setup+access）
    reset_active_low: True   # 复位极性（缺省 True = 低有效，驱动/监控复位门控用）

    # ── agent 激活模式（可选，缺省 master/slave 均为 UVM_ACTIVE）──
    #   True/"UVM_ACTIVE"  → 构建 driver+sequencer（主动驱动）
    #   False/"UVM_PASSIVE"→ 仅构建 monitor（被动采样）
    #   渲染进: <name>_master_config / <name>_slave_config 缺省值、system_config.init_config
    #   注: loopback 自检套件固定 master-ACTIVE / slave-PASSIVE 拓扑，不受此处影响
    is_active:
      master: True
      slave: True

    # ── 接口参数（渲染进 interface #(...)）──
    parameters:
      - { type: int, name: ADDR_WIDTH, value: 32 }
      - { type: int, name: DATA_WIDTH, value: 32 }

    # ── HDL 类型（渲染进 interface 与 pkg，可选）──
    hdl_typedefs: []
    hvl_typedefs: []

    # ── 端口 ──
    #   name:  信号名
    #   dir:   output=master驱动 / input=slave驱动
    #   width: 位宽（1 = 单比特 logic；>1 = logic [width-1:0]）
    ports:
      - { name: paddr,   dir: output, width: ADDR_WIDTH }   # master → slave（引用参数）
      - { name: pwrite,  dir: output, width: 1           }   # master → slave
      - { name: psel,    dir: output, width: 1           }   # master → slave
      - { name: penable, dir: output, width: 1           }   # master → slave
      - { name: pwdata,  dir: output, width: DATA_WIDTH }   # master → slave（引用参数）
      - { name: prdata,  dir: input,  width: DATA_WIDTH }   # slave → master（引用参数）
      - { name: pready,  dir: input,  width: 1           }   # slave → master
      - { name: pslverr, dir: input,  width: 1           }   # slave → master

    # ── 事务字段 ──
    #   is_master: "True"  → master 字段（master 驱动/生成，slave monitor 回填为请求）
    #               "False" → slave 字段（slave 生成响应，master 采样）
    #   iscompare: "True"  → 参与 loopback scoreboard 比对（仅 is_master="True" 字段参与）
    #   isrand:    "True"  → master driver 默认驱动该字段（映射到同名 output 端口）
    transaction_vars:
      - { name: paddr,   type: "bit [ADDR_WIDTH-1:0]", iscompare: "True",  isrand: "True",  is_master: "True"  }
      - { name: pwrite,  type: "bit",                  iscompare: "True",  isrand: "True",  is_master: "True"  }
      - { name: pwdata,  type: "bit [DATA_WIDTH-1:0]", iscompare: "True",  isrand: "True",  is_master: "True"  }
      - { name: prdata,  type: "bit [DATA_WIDTH-1:0]", iscompare: "True",  isrand: "False", is_master: "False" }
      - { name: pslverr, type: "bit",                  iscompare: "True",  isrand: "False", is_master: "False" }

    # ── 事务约束（master/slave 分开，渲染进各自 seq_item 的 constraint）──
    transaction_constraints:
      master:
        - { name: c_paddr_align, value: "{ paddr[1:0] == 2'b00; }" }
      slave:
        - { name: c_prdata_range, value: "{ prdata inside {[0:32'hFFFF_FFFF]}; }" }

    # ── 通用配置字段（渲染进 <name>_config_base）──
    config_vars: []
    config_constraints: []

    # ── 响应信息（可选，供后续乱序/关联使用）──
    response_info: {}

    # ── LLM 注入点（协议时序逻辑，可选；留空走默认单拍驱动/采样）──
    #   custom_drive_logic:    master driver 的协议时序（task）
    #   custom_collect_logic:  monitor 的任务级帧采集（串行协议用）
    custom_drive_logic: ""
    custom_collect_logic: ""
