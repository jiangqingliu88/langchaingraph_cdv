# ============================================================
# Environment 定义 —— 聚合多个 agent + predictor + scoreboard
# ============================================================

environment:
  name: APB_env
  env_name: APB_env

  # ── Agent 实例（每项 = 一个 interface → master/slave agent）──
  #   slave 置 is_active: False —— 真实 DUT（apb_slave_dut）负责响应，slave agent 只采样
  agents:
    - name: apb_master
      type: "apb_master_agent"
      is_active: True
      is_master: True
      interface: apb
    - name: apb_slave
      type: "apb_slave_agent"
      is_active: False
      is_master: False
      interface: apb

  subenvs:
    - name: "apb_sys_env"
      type: "apb_system_env"
      interface: apb
  # 外部 VIP 集成（axi_system_env 类需外部提供，示例默认注释掉）
  # vipenvs:
  #   - name: "axi_sys_env"
  #     type: "axi_system_env"
  #     vip_path: ""

  # ── 时钟复位 VIP ──
  clk_rst_vip:
    enabled: true
    clocks:
      - { name: pclk, period_ps: 10000, duty_cycle: 50, initial_value: 0, jitter_ps: 0 }
    resets:
      - { name: presetn, assert_cycles: 10, recover_cycles: 5, active_low: true, reset_type: ASYNC_SYNC_DEASSERT }

  # ── Harness 连接（测试 build_phase 调 <path>.set_vifs(env.get_full_name())）──
  #   harness 是 bind 进 u_dut 的，所以路径经过 DUT 实例
  harness_connect:
    path: "APB_bench_tb_top.u_dut.harness"
    env_suffix: ""

  scoreboards:
    - name: apb_scb
      sb_type: in_order_scoreboard
      trans_type: apb_master_seq_item
    # 旧格式（生成式 scoreboard，按端口表达式推断 item_type）
    # - name: apb_scb_gen
    #   mode: inorder
    #   expected_from: apb_pred
    #   actual_from: apb_slave
    #   key_field: req_id

  # ── Analysis 组件（predictor 等）──
  #   type: 组件类名
  analysis_components:
    - name: apb_pred
      type: apb_predictor
  analysis_exports: []
  analysis_ports: []

  # ── Register Model（RAL，列表风格；type 可为 "pkg::class" 或配 pkg 字段）──
  register_model:
    - bus_name: apb_master        # 总线 agent（type/name 匹配 env agents）
      type: "apb_master_agent"
    - reg_block_name: "apb_reg_block"
      type: "apb_ral_pkg::apb_reg_block"
    - reg_adpater_name: "apb_reg_adapter"
      type: "apb_reg_adapter"
    - predictor_name: "apb_reg_predictor"
      type: "uvm_reg_predictor"
      trans_type: "apb_master_seq_item"

  # ── 虚拟序列器 ──
  virtual_sequencer: { enabled: true }

  config_vars: []
  config_constraints: []

  # ── 语义 cross（P1-2）：[[字段A, 字段B], ...] → env_cov 生成 cross coverpoint ──
  coverage_crosses:
    - [paddr, pwrite]

  # ── TLM 连接（显式 driver → receiver；driver 用 env 级 analysis port
  #   `{agent}_agent_ap`，env 模板已自动把 monitor 接进来）──
  tlm_connections:
    - driver: apb_master_agent_ap
      receiver: apb_pred.in_export
    - driver: apb_pred.out_port
      receiver: apb_scb.expected_analysis_export
    - driver: apb_slave_agent_ap
      receiver: apb_scb.actual_analysis_export
