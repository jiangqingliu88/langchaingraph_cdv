#     # run_cmd 里两种写法各管一路：
#     #   `{{ }}`  = 模板变量（variables / local_vars），生成脚本时就替换掉
#     #   `${}`    = 环境变量，留给 shell 运行时展开 —— `${EMAN_*}` 是框架注入的
