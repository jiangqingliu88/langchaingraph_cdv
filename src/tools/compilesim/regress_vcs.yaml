# 测试配置文件
config:
  name: alu_verification
  description: "ALU 验证测试套件"
  
  # 全局默认值
  defaults:
    simulator: vcs
    compile_timeout: 600
    sim_timeout: 3600
    verbosity: UVM_MEDIUM
    waves: false
    coverage: false
    retry: 0
    count: 1
    pre_run: "echo 'Starting regression at $(date)'"
    post_run: "echo 'Regression finished at $(date)'"

  # ─── Build 定义 ───
  builds:
    - name: alu_base_build
      description: "ALU 基础编译"
      simulator: vcs
      pre_build:
        - "mkdir -p ./build/base"
        - "echo 'Cleaning old build...'"
        - "rm -f ./build/base/simv"
      post_build:
        - "echo 'Build completed'"
        - "cp ./build/base/simv ./backup/simv_$(date +%Y%m%d)"
      compile_options:
        - "-sverilog"
        - "-ntb_opts uvm-1.2"
        - "-timescale=1ns/1ps"
      filelist: alu_filelist.f
      top_module: alu_bench_tb_top
      output_dir: ./build/base
      compile_timeout: 300

    - name: alu_cov_build
      description: "带覆盖率编译"
      parent: alu_base_build
      pre_build:
        - "mkdir -p ./coverage"
        - "rm -rf ./coverage/*"
      post_build:
        - "urg -dir ./coverage -report ./coverage_report"
      compile_options:
        - "-cm line+tgl+branch+cond+fsm"
        - "-cm_dir ./coverage"
      output_dir: ./build/cov
      coverage: true

  # ─── Test 定义 ───
  tests:
    - name: alu_smoke_test
      build: alu_base_build
      tags: [smoke]
      seed: 12345
      count: 1
      pre_run:
        - "echo 'Starting smoke test'"
        - "rm -f ./test_logs/${TEST_NAME}_*.log"
      post_run:
        - "echo 'Smoke test done'"
        - "grep -q 'TEST PASSED' ${LOG_FILE} && echo 'PASS' || echo 'FAIL'"
      plusargs:
        - "+UVM_TESTNAME=alu_smoke_test"

    - name: alu_random_test
      build: alu_base_build
      tags: [sanity, random]
      seed: random
      count: 10
      sim_timeout: 300
      retry: 1
      pre_run:
        - "echo 'Running random test with ${COUNT} iterations'"
      post_run:
        - "echo 'Random test finished'"
        - "python3 parse_results.py --log ${LOG_FILE}"
      plusargs:
        - "+UVM_TESTNAME=alu_random_test"