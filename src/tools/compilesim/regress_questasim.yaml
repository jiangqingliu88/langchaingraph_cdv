# 测试配置文件
# Windows Questasim 2024.1 回归模板
config:
  name: alu_verification
  description: "ALU 验证测试套件"
  
  # 全局默认值
  defaults:
    simulator: questasim
    compile_timeout: 600
    sim_timeout: 3600
    verbosity: UVM_MEDIUM
    waves: false
    coverage: false
    retry: 0
    count: 1
    pre_run: "echo Starting regression at %DATE% %TIME%"
    post_run: "echo Regression finished at %DATE% %TIME%"

  # ─── Build 定义 ───
  builds:
    - name: alu_base_build
      description: "ALU 基础编译"
      simulator: questasim
      pre_build:
        - "if not exist .\\build\\base mkdir .\\build\\base"
        - "echo Cleaning old build..."
        - "if exist .\\build\\base\\simv del /q .\\build\\base\\simv"
      post_build:
        - "echo Build completed"
        - "if not exist .\\backup mkdir .\\backup"
        - "copy /Y .\\build\\base\\simv .\\backup\\simv_%DATE:~0,4%%DATE:~5,2%%DATE:~8,2%"
      compile_options:
        - "-sv"
        - "-timescale=1ns/1ps"
      filelist: alu_filelist.f
      top_module: alu_bench_tb_top
      output_dir: .\\build\\base
      compile_timeout: 300

    - name: alu_cov_build
      description: "带覆盖率编译"
      parent: alu_base_build
      pre_build:
        - "if not exist .\\coverage mkdir .\\coverage"
        - "if exist .\\coverage rmdir /s /q .\\coverage && mkdir .\\coverage"
      post_build:
        - "urg -dir .\\coverage -report .\\coverage_report"
      compile_options:
        - "-cm line+tgl+branch+cond+fsm"
        - "-cm_dir .\\coverage"
      output_dir: .\\build\\cov
      coverage: true

  # ─── Test 定义 ───
  tests:
    - name: alu_smoke_test
      build: alu_base_build
      tags: [smoke]
      seed: 12345
      count: 1
      pre_run:
        - "echo Starting smoke test"
        - "if exist .\\test_logs\\%TEST_NAME%_*.log del /q .\\test_logs\\%TEST_NAME%_*.log"
      post_run:
        - "echo Smoke test done"
        - "findstr /c:\"TEST PASSED\" %LOG_FILE% >nul && echo PASS || echo FAIL"
      plusargs:
        - "+UVM_TESTNAME=alu_smoke_test"

    - name: alu_random_test
      build: alu_base_build
      tags: [sanity, random]
      seed: random
      count: 10
      sim_timeout: 300
      retry: 1
      pre_run:
        - "echo Running random test with %COUNT% iterations"
      post_run:
        - "echo Random test finished"
        - "python parse_results.py --log %LOG_FILE%"
      plusargs:
        - "+UVM_TESTNAME=alu_random_test"
