# testcase_tools — Tool Schema 契约
# 每个 tool 定义: 输入参数、输出格式、风险等级

tools:
  parse_test_points:
    description: "从 spec JSON 提取 test_points，按 feature 分组"
    input:
      spec_json:
        type: string
        required: true
        description: "spec JSON 字符串 (含 test_points 数组)"
    output:
      type: json
      schema:
        total_categories: int
        total_tests: int
        categories:
          - category: string
            test_count: int
            tests:
              - name: string
                description: string
                priority: string
    risk_level: safe

  map_policies_to_tests:
    description: "将 test_points 按分类映射到策略场景"
    input:
      input_json:
        type: string
        required: true
        description: "含 categories + features + interfaces 的 JSON"
    output:
      type: json
      schema:
        scenarios:
          - name: string
            priority: string (P0|P1|P2)
            combinator_mode: string
            policies: list
            repeat: int
        available_policies: list
    risk_level: safe

  build_scenario_yaml:
    description: "场景 JSON → 完整 constraint YAML"
    input:
      scenarios_json:
        type: string
        required: true
        description: "场景定义 JSON"
    output:
      type: yaml
      schema:
        constraint: {name, env_name, regress_dir}
        transactions: list
        policies: list
        combinator: {default_mode, supported_modes}
        scenarios: list
    risk_level: safe

  build_priority_rules:
    description: "策略列表 → 权重规则"
    input:
      policies_json:
        type: string
        required: true
        description: "策略名称数组 JSON"
    output:
      type: json
      schema:
        priority_rules:
          - policy: string
            weight: int
    risk_level: safe

  generate_coverage_points:
    description: "spec test_points → covergroup SV 代码"
    input:
      spec_json:
        type: string
        required: true
        description: "含 test_points + env_name 的 JSON"
    output:
      type: systemverilog
      description: "完整 covergroup SV 文件"
    risk_level: safe

  generate_test_cases:
    description: "调用 CLI 从 constraint YAML 生成 SV 测试代码"
    input:
      yaml_spec:
        type: string
        required: true
        description: "constraint YAML 内容"
    output:
      type: json
      schema:
        total_tests: int
        tests:
          - id: string
            test_name: string
            files: list
    risk_level: medium
    side_effects: ["writes SV files to output/testcases/"]

  check_test_coverage:
    description: "对比 spec test_points vs 生成场景，检查覆盖率"
    input:
      spec_json:
        type: string
      scenarios_json:
        type: string
    output:
      type: json
      schema:
        total_test_points: int
        covered: int
        uncovered: int
        coverage_pct: string
        status: string (PASS|WARN)
    risk_level: safe
