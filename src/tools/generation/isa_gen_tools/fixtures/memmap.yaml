# ════════════════════════════════════════════════════════════════
# memmap —— 地址规则的唯一来源。
#
# ⚠ **这是从 `08_验证策略.md` §3.12.5 的结构重建的样例，不是冻结版。**
#
#   文档说冻结版 v1.0 在 `verification/memmap.yaml`，但那份文件**不在仓库里**。
#   这份 fixture 的作用是让分配器有东西可跑、让测试有据可依；它的字段细节
#   （区域的 base / size / align）应当以冻结版为准。
#
#   真文件到位后换掉即可 —— `repository/memmap.py` 的装载路径是可配置的，
#   代码一行不用改。
#
# 分配器读它做三件事：
#   1. 判断一个地址落在哪个 region（合法性）
#   2. 判断它有没有踩到 reserved（越界）
#   3. 按 region 的 align 决定张量该放在哪
# ════════════════════════════════════════════════════════════════

version: 1
comment: "重建样例（非冻结版）—— 结构照 08_验证策略.md §3.12.5"

chip:
  dies: 4
  clusters_per_die: 4
  cores_per_cluster: 16

# Peer 模型实例的可寻址坐标
peers:
  - {id: peer0, die: 0, cluster: 1}
  - {id: peer1, die: 1, cluster: 2}

# 全局地址空间的合法区域
regions:
  # 每核局部 SPAD：32 字节（256bit）对齐
  - name: lmem.core.spad
    domain: lmem
    per: core
    base: 0x0_0000_0000
    size: 128KB
    align: 32

  # 每核 CIMC：与 SPAD 是同一块局部存储的两个面（CIMC_flag 区分）
  - name: lmem.core.cimc
    domain: lmem
    per: core
    size: 128KB
    align: 32

  # Share DRAM：4KB 粒度跨 16 个 bank 轮转交织，bank 号即地址 [15:12]
  - name: dram.share
    domain: dram_share
    base: 0x1_0000_0000
    size: 2GB
    granule: 4KB
    banks: 16

  # Common DRAM：bank 级顺序映射，不交织
  # 真实空间 384MB + 伪 128MB —— **伪空间不得用于生成分配**
  - name: dram.common
    domain: dram_common
    per: bank
    base: 0x2_0000_0000
    size: 512MB
    real_size: 384MB

# 禁止分配区（负例用它做越界）
reserved:
  - [0x2_1800_0000, 0x2_1FFF_FFFF]

# 同一物理资源的不同视图
aliases:
  - {name: local_common_dram, maps_to: dram.common, view: local}
