# ============================================================
# Environment 定义 —— 聚合多个 agent + predictor + scoreboard
# ============================================================

environment:
  name: apb_env

  # ── Agent 实例（每项 = 一个 interface → master/slave agent）──
  #   slave 置 is_active: False —— 真实 DUT（apb_slave_dut）负责响应，slave agent 只采样
  agents:
    - name: apb_master
      is_active: True
      is_master: True
      interface: apb
      type: apb_master_agent

    - name: apb_slave
      is_active: False
      is_master: False
      interface: apb
      type: apb_slave_agent

  # subenvs:
  #   - name: "apb_sys_env"
  #     interface: apb_system
  #     type: apb_system_env

  # 外部 VIP 集成（axi_system_env 类需外部提供，示例默认注释掉）

  # vipenvs:
  #   - name: "axi_sys_env"
  #     type: "axi_system_env"
  #     vip_path: ""

  # ── 时钟复位 VIP ──
  clk_rst_vip:
    enabled: true
    clocks:
      - { name: pclk, period_ps: 10000, duty_cycle: 50, initial_value: 0, jitter_ps: 0 }
    resets:
      - { name: presetn, assert_cycles: 10, recover_cycles: 5, active_low: true, reset_type: ASYNC_SYNC_DEASSERT }

  register_model:
    - bus_name: apb_master
      type: "apb_master_agent"
    - reg_block_name: "apb_reg_block"
      type: "apb_ral_pkg::apb_reg_block"
    - reg_adapter_name: "apb_reg_adapter"
      type: "apb_interface_pkg::apb_reg_adapter"
    - predictor_name: "apb_reg_predictor"
      type: "uvm_reg_predictor"
      trans_type: "apb_master_seq_item"

  # ── 计分板 / 参考模型：**本示例刻意不接** ──
  #
  # `analysis_components` 生成的 `apb_predictor` 里，`process_in_export()` 是
  # **一行 TODO 的空壳**（模板 `util_comp.sv.j2` 的扩展点，注释写着
  # "override in derived class"）：它从 `in_export` 收事务，但**永不写 `out_port`**。
  # 把它接进 `in_order_scoreboard` 的 expected 侧，结果是 expected 恒为 0、
  # actual 是一堆真事务 → 每条测试都报
  #   UVM_ERROR [apb_scb] scoreboard FAILED: extras=N
  # ——那是**假失败**，会污染整条回归的结论。
  #
  # 要恢复比对，先有一个真的参考模型（派生 `apb_predictor` 实现 `process_in_export`，
  # 或换成对着 DUT 语义写的 model），再把下面三段接回去。
  #
  # 本示例的"检查"落在另外两处，都是**真检查**、不依赖参考模型：
  #   · 寄存器自带序列（hw_reset / bit_bash / access）—— 直接判 DUT 行为
  #   · `apb_reg_predictor`（RAL 的预测器）—— 由总线事务更新寄存器模型的镜像
  #
  #   scoreboards:
  #     - name: apb_scb
  #       sb_type: in_order_scoreboard
  #       trans_type: apb_master_seq_item
  #       params: [apb_master_seq_item, apb_master_seq_item]
  #   analysis_components:
  #     - name: apb_pred
  #       type: apb_predictor
  scoreboards: []
  analysis_components: []
  analysis_exports: []
  analysis_ports: []

  # ── Register Model（RAL，列表风格；type 可为 "pkg::class" 或配 pkg 字段）──
  register_model:
    - bus_name: apb_master        # 总线 agent（type/name 匹配 env agents）
      type: "apb_master_agent"
    - reg_block_name: "apb_reg_block"
      type: "apb_ral_pkg::apb_reg_block"
    - reg_adpater_name: "apb_reg_adapter"
      type: "apb_reg_adapter"
    - predictor_name: "apb_reg_predictor"
      type: "uvm_reg_predictor"
      trans_type: "apb_master_seq_item"

  config_vars: []
  config_constraints: []

  # ── 语义 cross（P1-2）：[[字段A, 字段B], ...] → env_cov 生成 cross coverpoint ──
  coverage_crosses:
    - [paddr, pwrite]

  # ── TLM 连接（显式 driver → receiver；driver 用 env 级 analysis port
  #   `{agent}_agent_ap`，env 模板已自动把 monitor 接进来）──
  #
  # **端口名以 scoreboard 类为准**：`in_order_scoreboard` 的两个入口叫
  # `actual_export`（REQ_T，来自 monitor）和 `expected_export`（RSP_T，来自参考模型），
  # 不叫 `*_analysis_export`。写错名字在 vopt 阶段报
  # "No field named 'actual_analysis_export'"，整个设计加载不了。
  #
  # **类型以参数为准**：`in_order_scoreboard#(REQ_T, RSP_T, CMP_T)` 里
  # REQ_T = actual 侧类型、RSP_T = expected 侧类型，比较器默认
  # `default_comparator#(REQ_T)` 要求两侧**同一类型**。本环境两侧都用
  # `apb_master_seq_item`：expected 来自 apb_predictor（其 out_port 就是
  # apb_master_seq_item），actual 来自 **master monitor** —— DUT 的真实响应
  # 由 master driver 采样后写回同一条 req，所以 master 侧事务才是"实际值"。
  # 接 slave 的 `apb_slave_agent_ap` 会报类型不兼容（那是另一种 seq_item）。
  # 同上：预测器/计分板未接，这里相应地留空。
  tlm_connections: []
