# alu_agent.yaml
interfaces:
    name: ALU_in
    # 时钟和复位信号名
    clock: clk
    reset: rst

    # 接口参数（可传入宽度等）
    parameters:
      - { name: ALU_WIDTH, type: int, value: '8' }
      - { name: ALU_OP_WIDTH, type: int, value: '3' }

    # HDL 类型定义（会出现在 interface 中）
    hdl_typedefs:
      - name: alu_op_t
        type: "enum logic [2:0] {ADD=3'b000, SUB=3'b001, MUL=3'b010}"
      - name: alu_data_t
        type: "logic [ALU_WIDTH-1:0]"

    # HVL 类型定义（会出现在 transaction 中）
    hvl_typedefs:
      - name: alu_result_t
        type: "bit [2*ALU_WIDTH-1:0]"

    # 接口端口
    ports:
      - { name: clk,   dir: input,  width: 1 }
      - { name: rst,   dir: input,  width: 1 }
      - { name: a,     dir: output, width: ALU_WIDTH }
      - { name: b,     dir: output, width: ALU_WIDTH }
      - { name: op,    dir: output, width: ALU_OP_WIDTH }
      - { name: valid, dir: output, width: 1 }
      - { name: ready, dir: input,  width: 1 }
      - { name: result,dir: input,  width: 2*ALU_WIDTH }

    # 事务级变量（每个 item 的成员）
    transaction_vars:
      - { name: a,     type: "bit [ALU_WIDTH-1:0]", iscompare: 'True', isrand: 'True' }
      - { name: b,     type: "bit [ALU_WIDTH-1:0]", iscompare: 'True', isrand: 'True' }
      - { name: op,    type: alu_op_t,              iscompare: 'True', isrand: 'True' }
      - { name: result, type: alu_result_t,           iscompare: 'True', isrand: 'False' }

    # 事务约束（随机化控制）
    transaction_constraints:
      - name: valid_op_c
        value: '{ op inside {ADD, SUB, MUL}; }'
      - name: data_range_c
        value: '{ a < 128; b < 128; }'

    # 配置类变量（可选，但 cfg 始终生成）
    config_vars:
      - { name: mode, type: "bit [1:0]", value: "2'b01" }
      - { name: enable_coverage, type: bit, value: "1'b1" }
    config_constraints:
      - name: mode_valid_c
        value: "{ mode inside {2'b00, 2'b01}; }"

    # 响应信息（可影响 Monitor 实现，此处保留）
    response_info:
      data: [result]
      operation: 1'b0