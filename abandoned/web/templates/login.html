<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>SignOffAI</title>
<script>
(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t)})()
</script>
<style>
:root{--bg:#0a0e14;--card:#181e28;--text:#e2e6ed;--blue:#3b82f6;--green:#10b981}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Segoe UI,sans-serif;font-size:13px;height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:var(--card);border-radius:12px;padding:36px 32px;width:380px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.login-box h2{font-size:22px;font-weight:700;text-align:center;margin-bottom:24px}
.login-box h2 span{color:var(--green)}
.login-box .field{margin-bottom:14px}
.login-box .field label{display:block;font-size:11px;font-weight:600;color:#8896a6;margin-bottom:5px;text-transform:uppercase}
.login-box .field input{width:100%;padding:10px 12px;background:#1a202c;border:1px solid #1e2632;border-radius:4px;font-size:12px;color:var(--text);outline:none;box-sizing:border-box}
.login-box .field input:focus{border-color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 14px;border-radius:4px;font-size:12px;font-weight:550;cursor:pointer;border:1px solid transparent;width:100%;background:var(--blue);color:#fff}
.btn:hover{opacity:.9}
.hint{text-align:center;margin-top:12px;font-size:10px;color:#5a6678}
.error{color:#ef4444;font-size:11px;text-align:center;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="login-box" id="loginBox">
    <h2>Sign<span>Off</span>AI</h2>
    <div class="field"><label>Username</label><input id="loginUser" value="admin"></div>
    <div class="field"><label>Password</label><input id="loginPass" type="password" value="admin123"></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">Sign In</button>
    <div class="hint">admin / admin123</div>
    <div class="error" id="loginError"></div>
</div>

<script>
async function doLogin(){
    var u=document.getElementById('loginUser').value;
    var p=document.getElementById('loginPass').value;
    var errEl=document.getElementById('loginError');
    errEl.textContent='Logging in...';
    try{
        var resp=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        var d=await resp.json();
        if(!resp.ok||!d.token){errEl.textContent=d.detail||'Invalid credentials';return}
        localStorage.setItem('token',d.token);
        localStorage.setItem('user',JSON.stringify(d.user));
        window.location.href='/app';
    }catch(e){errEl.textContent='Network error: '+e.message}
}
// Also allow Enter key to submit
document.getElementById('loginPass').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()})
</script>
</body>
</html>
