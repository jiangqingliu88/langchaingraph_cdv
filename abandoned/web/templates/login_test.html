<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Login Test</title></head>
<body>
<h2>IC验证平台 - 登录测试</h2>
<div><input id="u" placeholder="用户名" value="admin"></div>
<div><input id="p" type="password" placeholder="密码" value="admin123"></div>
<button onclick="login()">登录</button>
<div id="msg"></div>
<script>
async function login(){
    const u=document.getElementById('u').value;
    const p=document.getElementById('p').value;
    document.getElementById('msg').textContent='登录中...';
    try{
        const res=await fetch('/api/auth/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({username:u,password:p})
        });
        const data=await res.json();
        if(res.ok){
            document.getElementById('msg').textContent='登录成功! token='+data.token.substring(0,30)+'...';
        }else{
            document.getElementById('msg').textContent='失败: '+JSON.stringify(data);
        }
    }catch(e){
        document.getElementById('msg').textContent='网络错误: '+e.message;
    }
}
</script>
</body></html>
