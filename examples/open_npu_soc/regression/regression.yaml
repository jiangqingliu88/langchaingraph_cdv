config_name: open_npu_soc
# 由 SoC CLI 适配层/README 设置：export SOC_ROOT=<repo>/examples/open_npu_soc
variables:
  SOC_ROOT: "${SOC_ROOT}"

builds:
  - name: build_soc
    top: tb_soc_top
    # `+acc`：不给访问权限时 vopt 会删掉绝大部分信号，qwave.db 里只剩
    # 顶层几根线（实测 1.1 KB）；编译期保留访问后波形才有 DUT 细节。
    # 说明：vopt 的 `-designfile design.bin`（Visualizer 源码浏览）在
    # 低内存机器上会触发 viscom 峰值 3GB 并导致 vopt VirtualAlloc 失败，
    # 默认关闭；需要源码浏览时单独生成 design.bin。
    run_cmd: 'cd ${SOC_ROOT} && vlog -sv +acc -linedebug -f filelist.f -l ${EMAN_COMPILE_DIR}/build.log && vopt -work ${SOC_ROOT}/work -linedebug +acc -suppress 7061 -suppress 3009 -o tb_soc_top_opt tb_soc_top -l ${EMAN_COMPILE_DIR}/vopt.log'

  # E203 C 用例：e203_hbirdv2/ 是**只读**依赖 —— 先编整棵树，再在文件表末尾
  # 编我们的 NICE 适配器 / INT8 GEMM，用同名模块覆盖树内旧副本。
  # 用 build 自己的 work 库，避免和 build_soc 的 <SOC_ROOT>/work 抢；
  # +define+E203_C_RUN 让 tb_soc_top 例化 E203 tb_top。
  - name: build_e203_c
    top: tb_soc_top
    run_cmd: >-
      { find "${SOC_ROOT}/e203_hbirdv2/rtl/e203" -name '*.v';
      echo "${SOC_ROOT}/e203_hbirdv2/tb/tb_top.v";
      echo "${SOC_ROOT}/tb/tb_soc_top.sv";
      echo "${SOC_ROOT}/npu/npu_top.sv";
      echo "${SOC_ROOT}/npu/nice_disp/e203_nice_npu_adapter.sv";
      echo "${SOC_ROOT}/npu/npu/int8_gemm.sv"; }
      > ${EMAN_COMPILE_DIR}/e203_c_filelist.f &&
      mkdir -p ${EMAN_COMPILE_DIR}/work &&
      vlog -sv -mfcu -work ${EMAN_COMPILE_DIR}/work +acc -linedebug
      +incdir+${SOC_ROOT}/e203_hbirdv2/rtl/e203/core
      +incdir+${SOC_ROOT}/e203_hbirdv2/rtl/e203/perips
      +incdir+${SOC_ROOT}/e203_hbirdv2/rtl/e203/perips/apb_i2c
      +define+DISABLE_SV_ASSERTION=1 +define+E203_C_RUN=1
      -f ${EMAN_COMPILE_DIR}/e203_c_filelist.f
      -l ${EMAN_COMPILE_DIR}/build.log &&
      vopt -work ${EMAN_COMPILE_DIR}/work
      -linedebug +acc -suppress 7061 -suppress 3009
      -o tb_soc_top_opt tb_soc_top -l ${EMAN_COMPILE_DIR}/vopt.log

tests:
  - name: gemm_8x8
    build: build_soc
    tags: ["gemm", "p0"]
    file_pattern: ["npu/"]
    hooks:
      pre_sim: 'cd ${SOC_ROOT} && python golden/gemm_golden.py --out vectors'
    # **用子 shell 切到 SOC_ROOT**：`cd` 不能污染 sim.sh 的 cwd，否则
    # `-l sim_vsim.log` 和框架的 `wave.log` 会落到工程根而不是用例目录，
    # 报告里 `wave_path` 永远是 None。
    # **必须一行**：run_cmd 会原样写进 sim.sh，YAML 折行会变成多条命令。
    run_cmd: >-
      (cd ${SOC_ROOT} && vsim -c -work ${SOC_ROOT}/work -suppress 3009 -suppress 7061 tb_soc_top_opt -do "log -r /*; run -all; quit" -l ${EMAN_RUN_DIR}/sim_vsim.log -qwavedb=+signal+memory=4096,4+class+wavefile=${EMAN_RUN_DIR}/waves/gemm_8x8.db && [ -s ${EMAN_RUN_DIR}/sim_vsim.log ] && grep -q "mismatched=0" ${EMAN_RUN_DIR}/sim_vsim.log && grep -q "PASS" ${EMAN_RUN_DIR}/sim_vsim.log)

  # E203 CPU 执行 bare-metal C（sw/tests/gemm_8x8.c），经 NICE custom3 驱动
  # NPU/DMA/SRAM；判据是 E203 tb_top 的 TEST_PASS。波形里能看 custom3 指令
  # 与适配器 ICB 事务（`soc wave <run> --test gemm_8x8_c` 打开）。
  - name: gemm_8x8_c
    build: build_e203_c
    tags: ["gemm", "c", "e203"]
    file_pattern: ["sw/", "npu/"]
    hooks:
      pre_sim: 'cd ${SOC_ROOT} && python sw/build_sw.py'
    # **必须一行**；E203 tb_top 读 <TESTCASE>.verilog，固件里的 @80000000
    # 要改成 @0（TB 把镜像装进 ITCM index 0）。
    # cwd=用例目录（不 cd 到 SOC_ROOT）：tb_top 的 plusargs/readmemh 是两个
    # time-0 initial，开 +acc 后顺序会变；在 cwd 放一份 `.verilog` 兜底，
    # readmemh 先跑时也能装进固件。
    run_cmd: >-
      (cd ${EMAN_RUN_DIR} && mkdir -p waves
      && cp ${SOC_ROOT}/sw/gemm_8x8.verilog gemm_8x8_c.verilog
      && sed -i 's/@80000000/@00000000/' gemm_8x8_c.verilog
      && cp gemm_8x8_c.verilog .verilog
      && vsim -c -work ${EMAN_COMPILE_DIR}/work -suppress 3009 -suppress 7061 tb_soc_top_opt
      +TESTCASE=${EMAN_RUN_DIR}/gemm_8x8_c +DUMPWAVE=0
      -do "log -r /*; run -all; quit" -l ${EMAN_RUN_DIR}/sim_vsim.log
      -qwavedb=+signal+memory=4096,4+class+wavefile=${EMAN_RUN_DIR}/waves/gemm_8x8_c.db
      && grep -q "TEST_PASS" ${EMAN_RUN_DIR}/sim_vsim.log)
